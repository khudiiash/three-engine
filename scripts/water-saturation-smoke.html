<!doctype html><html><head><link rel="icon" href="data:,"></head><body><script type="module">
import * as THREE from 'three/webgpu';
import { mix, positionWorld, vec3, float } from 'three/tsl';
import { createGridSimulation } from '/src/engine/vfx/gridSimulation.js';
import { waterSlotPool } from '/src/engine/vfx/waterSlots.js';
import { installWaterSurfaceLook } from '/src/engine/vfx/waterSurfaceLook.js';
import { installWaterMedium } from '/src/engine/vfx/waterMedium.js';
import { installWaterCausticLight, updateWaterSlot } from '/src/engine/vfx/waterCaustics.js';

/**
 * ══ "STILL SEEING ALL THE WAY TO THE BOTTOM AT SATURATION 1" ═══════════════
 *
 * The reported pool, transform for transform from the live scene (2026-09-06):
 * a BOX water 9.70 x 1.94 x 9.70 whose lid sits at y = +0.531, wearing
 * `builtin:Water.mat`, with the lake bed 0.45 m below the volume's own floor.
 *
 * ⚠ THIS IS DELIBERATELY NOT `water-look-smoke.html`. That page carries a sun,
 * shadows, a mirror, markers and a GI-sized material set, and answering one
 * question inside it costs minutes of pipeline compilation. Everything here
 * exists to make ONE number legible: how much of the floor survives the water
 * above it, as `saturation` is swept. A statistic can only answer the question
 * it was built to ask, and this one is built to ask exactly that.
 *
 * The measurement is CONTRAST, not brightness. A tinted floor is still a
 * visible floor — "we can't see through it at all" means the checker pattern
 * has gone, and a pattern is a difference between neighbours. Brightness alone
 * cannot tell "opaque" from "lit differently".
 */
const IMAGES = [];
const log = (...a) => console.log('SAT:', ...a);
try {
 const adapter = await navigator.gpu.requestAdapter();
 const device = await adapter.requestDevice({ requiredLimits: { maxStorageBuffersPerShaderStage: 8 } });
 const errors = []; device.addEventListener('uncapturederror', (e) => { errors.push(e.error.message); console.error('WebGPU validation', e.error.message); });
 // Rows pad to 256 B on readback: 896 * 4 = 14 * 256.
 const W = 896, H = 560;
 const renderer = new THREE.WebGPURenderer({ device, antialias: false });
 await renderer.init(); renderer.setSize(W, H);
 document.body.append(renderer.domElement);
 const target = new THREE.RenderTarget(W, H);
 target.texture.colorSpace = THREE.SRGBColorSpace;
 target.depthTexture = new THREE.DepthTexture(W, H);

 const scene = new THREE.Scene();
 scene.backgroundNode = mix(vec3(.62, .83, 1), vec3(.11, .37, .74), positionWorld.normalize().y.max(0).pow(.6));
 scene.background = new THREE.Color('#7fb8f0');
 const engine = { scene, renderer, camera: null, onUpdate: (fn) => { engine._tickers.push(fn); return () => {}; },
   _tickers: [], on: () => () => {}, off: () => {}, modules: { get: () => null } };
 const pool = waterSlotPool(engine);

 const sun = new THREE.DirectionalLight('#fff6e0', 3);
 sun.position.set(6, 9, 4); scene.add(sun); scene.add(sun.target);
 scene.add(new THREE.AmbientLight('#bcd6ff', .35));

 // ── THE LAKE BED: A CHECKER, SO "CAN I STILL SEE IT" IS A NUMBER ─────────
 const bed = new THREE.MeshStandardNodeMaterial({ roughness: .9 });
 { const grid = positionWorld.xz.div(1.2).fract().sub(.5).abs().sub(.02).step(0);
   bed.colorNode = mix(vec3(.08, .09, .10), vec3(.88, .90, .92), grid.x.mul(grid.y)); }
 const floor = new THREE.Mesh(new THREE.BoxGeometry(14, .1, 14), bed);
 floor.position.set(-.088, -1.856, 1.557); scene.add(floor);

 // ── THE WATER, AS THE COMPONENT ASSEMBLES IT FOR A *BOX* SOURCE ──────────
 // Entity transform and props copied from the live scene.
 const holder = new THREE.Object3D();
 holder.position.set(-0.08798399404294877, -0.43854009522006265, 1.55710948927746);
 holder.scale.set(9.699928941239067, 1.9399857882478133, 9.699928941239067);
 scene.add(holder);
 // A box source resolves width/height/waterDepth from the geometry's own size,
 // which for the unit box the editor creates is 1 x 1 x 1 — see
 // `GridSimulationComponent.sourceProps`.
 const props = { resolution: 128, width: 1, height: 1, waterDepth: 1, damping: .998,
   waveSpeed: 1, amplitude: 0, waveHeight: .1, waveLength: 2, waveOctaves: 8, waveGain: .5,
   waveDirection: 0, choppiness: 1, rippleStrength: 1, surfaceDetail: 1.15,
   caustics: true, causticIntensity: 1, color: '#4c9db8', roughness: .5, style: 'realistic',
   deepColor: '#05231f', saturation: .5, transmission: 1, foam: .2, foamThreshold: .5 };
 // `builtin:Water.mat`, property for property.
 const authored = new THREE.MeshPhysicalNodeMaterial({ color: '#8fd8de', roughness: .12, metalness: 0,
   ior: 1.333, transmission: .9, thickness: 0, opacity: 1, transparent: true, depthWrite: false, side: THREE.DoubleSide });
 const slot = pool.claim({});
 const sim = createGridSimulation('water', props, { material: authored, waterSlot: slot, anchorEngine: engine });
 holder.add(sim.mesh);
 // The component puts the lid on the box's TOP face.
 sim.mesh.matrixAutoUpdate = false;
 sim.mesh.matrix.identity().multiply(new THREE.Matrix4().makeTranslation(0, .5, 0));
 sim.mesh.matrixWorldNeedsUpdate = true;
 holder.updateMatrixWorld(true);
 installWaterMedium(engine);
 installWaterCausticLight(engine);
 const look = installWaterSurfaceLook({ engine, mesh: sim.mesh, material: sim.mesh.material, simulation: sim, slot });

 const camera = new THREE.PerspectiveCamera(55, W / H, .05, 200);
 engine.camera = camera;
 camera.position.set(-.1, 3.2, 9.6); camera.lookAt(-.1, -1.2, 1.4); camera.updateMatrixWorld(true);

 const step = async () => {
   sim.tick(renderer, 1 / 60);
   updateWaterSlot({ engine, slot, kernel: sim.slotKernel, mesh: sim.mesh, simulation: sim, props });
   for (const fn of engine._tickers) fn();
   await device.queue.onSubmittedWorkDone();
 };
 log('compiling…');
 await renderer.computeAsync(sim.init);
 for (let i = 0; i < 40; i++) await step();
 log('warm');

 const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
 const ctx = canvas.getContext('2d');
 const shoot = async (label) => {
   renderer.setRenderTarget(target);
   await renderer.renderAsync(scene, camera);
   const px = await renderer.readRenderTargetPixelsAsync(target, 0, 0, W, H);
   renderer.setRenderTarget(null);
   const image = ctx.createImageData(W, H);
   for (let i = 0; i < W * H * 4; i += 4) { for (let c = 0; c < 3; c++) image.data[i + c] = px[i + c]; image.data[i + 3] = 255; }
   ctx.putImageData(image, 0, 0);
   IMAGES.push({ label, url: canvas.toDataURL('image/png') });
   return px;
 };
 // The checker's contrast inside a window on the submerged floor: the mean
 // absolute deviation from the window's own mean, in luma. A visible checker
 // scores tens; an opaque plate scores ~0 whatever colour it is.
 const luma = (px, i) => px[i] * .2126 + px[i + 1] * .7152 + px[i + 2] * .0722;
 const contrast = (px, cx, cy, r) => {
   let sum = 0, n = 0;
   for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) { sum += luma(px, (y * W + x) * 4); n++; }
   const mean = sum / n; let dev = 0;
   for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) dev += Math.abs(luma(px, (y * W + x) * 4) - mean);
   return { contrast: +(dev / n).toFixed(1), mean: +mean.toFixed(1) };
 };
 // Two windows: one where the view crosses little water (far side, shallow
 // slant) and one where it crosses a lot. Both are inside the volume footprint.
 const windows = [{ label: 'near-bed', cx: Math.round(W * .5), cy: Math.round(H * .72), r: 22 },
                  { label: 'far-bed', cx: Math.round(W * .5), cy: Math.round(H * .5), r: 22 }];

 const dry = await (async () => {
   sim.mesh.visible = false; slot.uniforms.active.value = 0;
   for (let i = 0; i < 2; i++) await step();
   const px = await shoot('dry');
   sim.mesh.visible = true;
   return windows.map((w) => contrast(px, w.cx, w.cy, w.r));
 })();
 log('DRY (no water at all)', JSON.stringify(Object.fromEntries(windows.map((w, i) => [w.label, dry[i]]))));

 for (const saturation of [0, .5, 1]) {
   sim.update({ ...props, saturation });
   for (let i = 0; i < 4; i++) await step();
   const px = await shoot(`saturation-${String(saturation).replace('.', 'p')}`);
   const wet = windows.map((w) => contrast(px, w.cx, w.cy, w.r));
   const sg = slot.uniforms.sigma.value;
   log(`saturation ${saturation}`,
     'sigma/world-m', JSON.stringify([sg.x, sg.y, sg.z].map((v) => +v.toFixed(2))),
     'absorption/local', +slot.uniforms.absorption.value.toFixed(1),
     'active', slot.uniforms.active.value,
     JSON.stringify(Object.fromEntries(windows.map((w, i) =>
       [w.label, { ...wet[i], keptContrast: +(wet[i].contrast / Math.max(.1, dry[i].contrast)).toFixed(2) }]))));
 }

 // ⛔ IS IT THE MEDIUM OR THE LID? Same saturation, medium armed, surface not
 // drawn. If the floor goes opaque here but not through the lid, the medium is
 // correct and three's screen-space transmission is bypassing it.
 {
   sim.update({ ...props, saturation: 1 });
   for (let i = 0; i < 3; i++) await step();
   sim.mesh.visible = false; slot.uniforms.active.value = 1;
   const px = await shoot('saturation-1-no-lid');
   const wet = windows.map((w) => contrast(px, w.cx, w.cy, w.r));
   log('saturation 1, MEDIUM WITHOUT THE LID',
     JSON.stringify(Object.fromEntries(windows.map((w, i) =>
       [w.label, { ...wet[i], keptContrast: +(wet[i].contrast / Math.max(.1, dry[i].contrast)).toFixed(2) }]))));
   sim.mesh.visible = true; sim.update(props);
   for (let i = 0; i < 2; i++) await step();
 }

 // ── HOW MUCH WATER DOES THE MEDIUM THINK IS THERE? ───────────────────────
 // The whole effect is one number per pixel. Draw it: R = crossed length / 4 m.
 {
   const { Fn: fn, vec4: v4 } = await import('three/tsl');
   const { waterSegmentNode } = await import('/src/engine/vfx/waterMedium.js');
   const previous = scene.fogNode;
   scene.fogNode = fn(() => {
     const seg = waterSegmentNode(slot);
     return v4(seg.length.div(4).clamp(0, 1), seg.near.div(2).clamp(0, 1), seg.far.div(2).clamp(0, 1), float(1));
   })();
   sim.mesh.visible = false;
   const px = await shoot('segment-length');
   const read = (cx, cy) => { const i = (cy * W + cx) * 4; return [px[i], px[i + 1], px[i + 2]].map((v) => +(Math.pow(v / 255, 2.2)).toFixed(2)); };
   for (const w of windows) {
     const c = read(w.cx, w.cy);
     log(`  segment @ ${w.label}: crossed ${(c[0] * 4).toFixed(2)} m, depth near ${(c[1] * 2).toFixed(2)} m far ${(c[2] * 2).toFixed(2)} m`);
   }
   scene.fogNode = previous; sim.mesh.visible = true;
 }

 // ── THE GODRAYS, FROM UNDER THE SURFACE ──────────────────────────────────
 // "Can we make the underwater godrays a bit smoother, less dithered? They look
 // too noisy... and probably they are changing way too fast" (user, 2026-09-06).
 // Both are measurable: NOISE is the mean absolute difference between
 // horizontally adjacent pixels (a dithered estimator's signature — real beams
 // are smooth across a scanline), and SPEED is the mean absolute difference
 // between two captures a fixed interval apart.
 {
   sim.update({ ...props, saturation: .35 });
   camera.position.set(0, -.55, 4.2); camera.lookAt(0, -.2, -2); camera.updateMatrixWorld(true);
   for (let i = 0; i < 8; i++) await step();
   const a = await shoot('shafts');
   for (let i = 0; i < 12; i++) await step();          // 0.2 s later
   const b = await shoot('shafts-later');
   const band = { x0: Math.round(W * .2), x1: Math.round(W * .8), y0: Math.round(H * .3), y1: Math.round(H * .8) };
   let noise = 0, moved = 0, n = 0;
   for (let y = band.y0; y < band.y1; y++) for (let x = band.x0; x < band.x1 - 1; x++) {
     const i = (y * W + x) * 4;
     noise += Math.abs(luma(a, i) - luma(a, i + 4));
     moved += Math.abs(luma(a, i) - luma(b, i));
     n++;
   }
   log('shafts: pixel-to-pixel NOISE', +(noise / n).toFixed(2),
       '| change over 0.2 s', +(moved / n).toFixed(2), '(lower is smoother/slower)');
 }

 log('validation', errors.length ? errors : 'clean');
 globalThis.__VFX_SMOKE_RESULT__ = { pass: errors.length === 0, images: IMAGES };
 console.log('WATER-SATURATION PASS');
} catch (error) {
 console.error(error.stack);
 globalThis.__VFX_SMOKE_RESULT__ = { pass: false, error: String(error.stack), images: IMAGES };
}
</script></body></html>
