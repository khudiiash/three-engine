<!doctype html><html><head><link rel="icon" href="data:,"></head><body><script type="module">
import * as THREE from 'three/webgpu';
import { mix, positionWorld, vec3 } from 'three/tsl';
import { createGridSimulation } from '/src/engine/vfx/gridSimulation.js';
import { waterSlotPool } from '/src/engine/vfx/waterSlots.js';
import { installWaterSurfaceLook } from '/src/engine/vfx/waterSurfaceLook.js';
import { installWaterMedium } from '/src/engine/vfx/waterMedium.js';
import { installWaterCausticLight, updateWaterSlot } from '/src/engine/vfx/waterCaustics.js';
import { waterAutoResolution } from '/src/engine/vfx/waterVolume.js';
import { halfToFloat } from '/src/engine/vfx/waterSpectrumCPU.js';
import { waterCrossedLengthNode } from '/src/engine/vfx/waterMedium.js';
import { waterProfileRadius } from '/src/engine/vfx/waterVolume.js';
import { Fn } from 'three/tsl';

/**
 * ══ THE SAME BODY, THE SAME FRAMING, THREE SIZES OF WATER ══════════════════
 *
 * "Impact from object hitting the water looks quite good, but only at specific
 * scale. Make it larger, and it does not work. We need to adjust our water to
 * any scale" (user, 2026-09-06). The only honest test of that sentence is to
 * hold everything the eye compares FIXED — the body, the drop, the camera's
 * distance in metres — and change only the size of the pool. Three pools, 5,
 * 20 and 60 metres across, three metres deep; a 0.5 m body arriving at 4 m/s;
 * the camera three metres from the splash every time. If the water is
 * scale-free the three rows of pictures are the same picture.
 *
 * The same pools also carry the two look items from the same report: the foam
 * (seen from above, at 45°) and the caustics (seen from under the surface,
 * looking across the floor). Every frame is written to disk; a number cannot
 * say whether foam "looks like foam".
 *
 * The pool is the user's own: their live component props, field for field.
 */
const IMAGES = [];
const log = (...a) => console.log('PREMIUM:', ...a);
const argument = (key, fallback) => { const v = new URL(location.href).searchParams.get(key); return v == null ? fallback : v; };
const SCALES = argument('scales', '5,20,60').split(',').map(Number);
const AUTO = argument('auto', '1') !== '0';
// ?shape=cylinder|sphere|cone|capsule fills that primitive instead of the box,
// to ?fill= of its height (the unit primitive: radius .5; height 1, capsule 2).
const SHAPE = argument('shape', 'box'), FILL = Number(argument('fill', SHAPE === 'box' ? '1' : '.75'));
const SHAPE_HEIGHT = SHAPE === 'capsule' ? 2 : 1;
// ?shaftMip=N reads the caustic map for the god rays at that mip (the sweep
// behind waterMedium.js's SHAFT_MIP).
if (argument('shaftMip', null) != null) globalThis.__waterShaftMip = Number(argument('shaftMip', '4'));
try {
 const adapter = await navigator.gpu.requestAdapter();
 const device = await adapter.requestDevice({ requiredLimits: { maxStorageBuffersPerShaderStage: 8 } });
 const errors = []; device.addEventListener('uncapturederror', (e) => { errors.push(e.error.message); console.error('WebGPU validation', e.error.message); });
 const W = 768, H = 512;                      // 768 * 4 = 12 * 256
 const renderer = new THREE.WebGPURenderer({ device, antialias: false });
 await renderer.init(); renderer.setSize(W, H);
 document.body.append(renderer.domElement);
 const target = new THREE.RenderTarget(W, H);
 target.texture.colorSpace = THREE.SRGBColorSpace;
 target.depthTexture = new THREE.DepthTexture(W, H);
 const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
 const ctx = canvas.getContext('2d');

 // The user's live component, field for field (entity "Water", 2026-09-06).
 const USER = { damping: .998, waveSpeed: 1, amplitude: 0, waveHeight: .2, waveLength: 5, waveOctaves: 8, waveGain: .45,
   waveDirection: 0, choppiness: 1, rippleStrength: 1, surfaceDetail: 2, caustics: true, causticIntensity: .5,
   color: '#268270', roughness: 0, style: 'realistic', deepColor: '#090b0b', saturation: .25, transmission: 1,
   foam: Number(argument('foam', '1')), foamThreshold: .5 };
 // Any wave/look field can be overridden from the URL (?waveHeight=.1&choppiness=0…) to
 // reproduce a user's own pool.
 for (const key of ['waveHeight', 'waveLength', 'choppiness', 'rippleStrength', 'surfaceDetail', 'causticIntensity', 'saturation', 'foamThreshold', 'waveOctaves', 'waveGain'])
   if (argument(key, null) != null) USER[key] = Number(argument(key, '0'));
 const DEPTH = 3;

 for (const S of SCALES) {
   const scene = new THREE.Scene();
   scene.backgroundNode = mix(vec3(.62, .83, 1), vec3(.11, .37, .74), positionWorld.normalize().y.max(0).pow(.6));
   scene.background = new THREE.Color('#7fb8f0');
   const engine = { scene, renderer, camera: null, onUpdate: (fn) => { engine._tickers.push(fn); return () => {}; },
     _tickers: [], on: () => () => {}, off: () => {}, modules: { get: () => null }, waterSlots: null };
   const pool = waterSlotPool(engine);
   const sun = new THREE.DirectionalLight('#fff6e0', 3);
   sun.position.set(6, 14, 4); scene.add(sun); scene.add(sun.target);
   scene.add(new THREE.AmbientLight('#bcd6ff', .35));

   // A tiled floor and walls: the pool's own box, so caustics have a receiver.
   const tiles = new THREE.MeshStandardNodeMaterial({ roughness: .9, color: '#ffffff' });
   { const grid = positionWorld.xz.div(.5).fract().sub(.5).abs().sub(.03).step(0);
     const wall = positionWorld.xy.div(.5).fract().sub(.5).abs().sub(.03).step(0);
     const flat = positionWorld.y.lessThan(-DEPTH + .95);
     tiles.colorNode = mix(vec3(.14, .16, .18), vec3(.86, .88, .9), flat.select(grid.x.mul(grid.y), wall.x.mul(wall.y))); }
   const floor = new THREE.Mesh(new THREE.BoxGeometry(S + 1, .1, S + 1), tiles);
   floor.position.y = -DEPTH; floor.receiveShadow = true; scene.add(floor);
   for (const [x, z, w, d] of [[S / 2 + .3, 0, .6, S + 1], [-S / 2 - .3, 0, .6, S + 1], [0, S / 2 + .3, S + 1, .6], [0, -S / 2 - .3, S + 1, .6]]) {
     const wall = new THREE.Mesh(new THREE.BoxGeometry(w, DEPTH + .6, d), tiles);
     wall.position.set(x, -DEPTH / 2 + .3, z); scene.add(wall);
   }
   // Something to make contact foam against: a post standing in the water.
   const post = new THREE.Mesh(new THREE.BoxGeometry(.5, 4, .5), new THREE.MeshStandardNodeMaterial({ color: '#ff3b28', roughness: .5 }));
   post.position.set(1.6, -1, -1.2); scene.add(post);

   const holder = new THREE.Object3D();
   holder.scale.set(S, DEPTH, S);
   scene.add(holder);
   const resolution = AUTO ? waterAutoResolution(S) : 128;
   const props = { ...USER, resolution, width: 1, height: 1, waterDepth: SHAPE_HEIGHT * FILL, shapeKind: SHAPE, shapeRadius: .5, shapeHeight: SHAPE_HEIGHT, enclosed: Number(argument('enclosed', '1')) };
   const authored = new THREE.MeshPhysicalNodeMaterial({ color: '#8fd8de', roughness: .12, metalness: 0, ior: 1.333,
     transmission: .9, thickness: 0, opacity: 1, transparent: true, depthWrite: false, side: THREE.DoubleSide });
   const slot = pool.claim({});
   const sim = createGridSimulation('water', props, { material: authored, waterSlot: slot, anchorEngine: engine, worldScale: { x: S, z: S } });
   holder.add(sim.mesh);
   sim.mesh.matrixAutoUpdate = false;
   sim.mesh.matrix.identity();                 // origin ON the lid, at world y = 0
   sim.mesh.matrixWorldNeedsUpdate = true;
   holder.updateMatrixWorld(true);
   installWaterMedium(engine);
   installWaterCausticLight(engine);
   installWaterSurfaceLook({ engine, mesh: sim.mesh, material: sim.mesh.material, simulation: sim, slot });
   log(`pool ${S} m: lid ${sim.clip ? `${sim.clip.levels} clipmap levels of ${sim.clip.size}² (${(sim.clip.cell.x * S * 100).toFixed(1)} cm at the eye, ${(sim.clip.cell.x * S * 2 ** (sim.clip.levels - 1)).toFixed(1)} m at the rim, ${sim.count} vertices)` : `${sim.resolution}² flat (${(S / (sim.resolution - 1) * 100).toFixed(1)} cm)`}, ripple window ${sim.ripple.resolution} cells over ${(sim.ripple.windowWidth * S).toFixed(1)} m (${(sim.ripple.cellX * S * 100).toFixed(1)} cm cells${sim.ripple.windowed ? ', following the camera' : ''})`);

   const camera = new THREE.PerspectiveCamera(55, W / H, .05, 400);
   engine.camera = camera;
   const pose = (eye, at) => { camera.position.set(...eye); camera.lookAt(...at); camera.updateMatrixWorld(true); };
   const step = async () => {
     sim.tick(renderer, 1 / 60);
     updateWaterSlot({ engine, slot, kernel: sim.slotKernel, mesh: sim.mesh, simulation: sim, props });
     for (const fn of engine._tickers) fn();
     await device.queue.onSubmittedWorkDone();
   };
   const run = async (n) => { for (let i = 0; i < n; i++) await step(); };
   const shoot = async (label) => {
     renderer.setRenderTarget(target);
     await renderer.renderAsync(scene, camera);
     const px = await renderer.readRenderTargetPixelsAsync(target, 0, 0, W, H);
     renderer.setRenderTarget(null);
     const image = ctx.createImageData(W, H);
     for (let i = 0; i < W * H * 4; i += 4) { for (let c = 0; c < 3; c++) image.data[i + c] = px[i + c]; image.data[i + 3] = 255; }
     ctx.putImageData(image, 0, 0);
     IMAGES.push({ label: `${String(S).padStart(3, '0')}m-${SHAPE === 'box' ? '' : SHAPE + '-'}${label}`, url: canvas.toDataURL('image/png') });
     return px;
   };
   await renderer.computeAsync(sim.init);
   await run(150);                              // 2.5 s: waves up, foam gathered


   // ── THE LOOK: foam from above at 45°, and the caustics from under ──────
   pose([-3.2, 3.4, 3.2], [.6, 0, -.6]);
   await shoot('foam-45');
   pose([0, 6, .001], [0, 0, 0]);
   await shoot('foam-top');
   pose([-1.6, -DEPTH + .5, 2.3], [1.2, -DEPTH, -1.6]);
   await shoot('caustics-under');
   pose([0, -DEPTH + 2.2, .001], [0, -DEPTH, 0]);
   await shoot('caustics-down');
   // From under the surface, looking up at 35°: Snell's window (the world
   // above) in the middle, total internal reflection of the pool toward the
   // horizon — the underside must not be a mirror of the floor everywhere.
   pose([0, -1.2, 0], [1.6, 0, 0]);
   await shoot('from-below');
   // A pool WALL under water, a metre away: caustics on it must be soft bands,
   // not chains of dots. Grain = |pixel − its 4 neighbours| over the frame's
   // mean luma, and its change over one frame.
   {
     // The wall FACING the sun (the sun stands at +x: the −x wall's inner face).
     pose([-1.4, -1.4, 0], [-2.6, -1.6, 0]);
     const a = await shoot('wall-caustics'); await run(1); const b = await shoot('wall-caustics-1f');
     const luma = (px, i) => px[i] * .2126 + px[i + 1] * .7152 + px[i + 2] * .0722;
     let mean = 0, grain = 0, change = 0, n = 0;
     for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
       const i = (y * W + x) * 4, l = luma(a, i);
       const around = (luma(a, i - 4) + luma(a, i + 4) + luma(a, i - W * 4) + luma(a, i + W * 4)) / 4;
       mean += l; grain += Math.abs(l - around); change += Math.abs(l - luma(b, i)); n++;
     }
     log(`wall caustics: grain ${(grain / mean * 100).toFixed(2)}% of the mean luma, one-frame change ${(change / mean * 100).toFixed(2)}% (mean luma ${(mean / n).toFixed(1)})`);
     if (!(grain / mean < .03)) throw new Error(`the wall is dotted: grain ${(grain / mean * 100).toFixed(2)}%`);
   }

   // ── THE SPLASH: a 0.5 m body arriving at 4 m/s, in the SAME place ──────
   //
   // Emitted the way `waterPhysics.js` emits: a press at the footprint the
   // buoyancy solve would report (a 0.5 m cube: silhouette 0.25 m², radius
   // 0.28 m), sized as draught + IMPACT_TIME × speed, then the rebound as the
   // body slows — a partial release, leaving the floating draught behind.
   const radius = Math.sqrt(.25 / Math.PI) / S;
   const draught = .5 * .95, entry = draught + 4 * .12;
   sim.addWaterImpulse(0, 0, radius, -entry / DEPTH);
   await run(3);
   pose([-2.2, 1.8, 2.2], [0, 0, 0]);
   await shoot('splash-0.05s');
   await run(9);
   sim.addWaterImpulse(0, 0, radius, (entry - draught) / DEPTH);
   await run(6);
   await shoot('splash-0.3s');
   await run(18);
   await shoot('splash-0.6s');
   await run(54);
   await shoot('splash-1.5s');
   await run(150);
   await shoot('splash-4s');
   pose([-3.2, 3.4, 3.2], [.6, 0, -.6]);
   await shoot('foam-after-splash');
   // How much of the lid the splash left foamed, 4 s on: the field itself.
   {
     const f = new Float32Array(await renderer.getArrayBufferAsync(sim.mesh.geometry.attributes.waterFoam));
     let sheet = 0, any = 0, sum = 0;
     for (let i = 0; i < sim.count; i++) { const v = f[i]; sum += v; if (v > .5) sheet++; if (v > .05) any++; }
     log(`foam 4 s after the splash (foam dial ${USER.foam}): mean ${(sum / sim.count).toFixed(3)}, ${(sheet / sim.count * 100).toFixed(1)}% of the lid a sheet (> .5), ${(any / sim.count * 100).toFixed(1)}% foamed at all (> .05)`);
     if (!(sheet / sim.count < .15 * USER.foam + .02)) throw new Error(`the splash foamed the pool: ${(sheet / sim.count * 100).toFixed(1)}% sheet`);
   }

   // The field at the wall against the field inside: a wall that piles a
   // wake up into spikes shows here as a rim far louder than the interior.
   {
     const w = sim.ripple.resolution, halves = await renderer.backend.copyTextureToBuffer(sim.rippleTexture, 0, 0, w, w);
     const lidR = SHAPE === 'box' ? .5 : waterProfileRadius(sim.shape, 0), cell = sim.ripple.cellX;
     let rimPeak = 0, rimSum = 0, rimN = 0, inPeak = 0, inSum = 0, inN = 0;
     for (let iy = 0; iy < w; iy++) for (let ix = 0; ix < w; ix++) {
       const x = (ix - (w - 1) / 2) * cell, z = (iy - (w - 1) / 2) * sim.ripple.cellZ, rr = SHAPE === 'box' ? Math.max(Math.abs(x), Math.abs(z)) : Math.hypot(x, z);
       const h = Math.abs(halfToFloat(halves[(iy * w + ix) * 4])) * DEPTH;
       if (rr > lidR) continue;
       if (rr > lidR - 3 * cell) { rimPeak = Math.max(rimPeak, h); rimSum += h * h; rimN++; } else { inPeak = Math.max(inPeak, h); inSum += h * h; inN++; }
     }
     const rimRms = Math.sqrt(rimSum / Math.max(1, rimN)), inRms = Math.sqrt(inSum / Math.max(1, inN));
     log(`${SHAPE} field 4 s after the splash: rim (3 cells) peak ${(rimPeak * 100).toFixed(1)} cm rms ${(rimRms * 100).toFixed(1)} cm · interior peak ${(inPeak * 100).toFixed(1)} cm rms ${(inRms * 100).toFixed(1)} cm`);
     if (!(inRms < .05 && rimRms < 3 * inRms + .01)) throw new Error(`the wall winds the field up: rim ${rimRms} interior ${inRms}`);
   }

   // ── A ROUND POOL: the lid hugs the outline, the shell meets the lid, and
   //    the medium's ray clip is the exact chord ─────────────────────────────
   if (SHAPE !== 'box') {
     const shape = sim.shape, lidR = waterProfileRadius(shape, 0);
     const v = new Float32Array(await renderer.getArrayBufferAsync(sim.mesh.geometry.attributes.position));
     const at = (idx) => [v[idx * 4], v[idx * 4 + 1], v[idx * 4 + 2]];
     let beyond = 0, onRim = 0;
     for (let i = 0; i < sim.count; i++) { const [x, , z] = at(i); const rr = Math.hypot(x, z); beyond = Math.max(beyond, rr - lidR); if (rr > lidR - 1e-4) onRim++; }
     // The rim ring is the flat grid's edge, or the clipmap's outer level.
     const rimN = sim.clip ? sim.clip.size : sim.resolution, lidBase = sim.clip ? (sim.clip.levels - 1) * rimN * rimN : 0;
     let seam = 0, worstSeam = '';
     for (let k = 0; k < 4 * rimN; k++) {
       const e = Math.floor(k / rimN), t = k % rimN;
       const [ix, iz] = e === 0 ? [t, 0] : e === 1 ? [rimN - 1, t] : e === 2 ? [rimN - 1 - t, rimN - 1] : [0, rimN - 1 - t];
       const lid = at(lidBase + iz * rimN + ix), wall = at(sim.count + k);
       const gap = Math.hypot(lid[0] - wall[0], lid[1] - wall[1], lid[2] - wall[2]);
       if (gap > seam) { seam = gap; worstSeam = `k ${k} (${ix},${iz}) lid ${lid.map((x) => x.toFixed(5))} wall ${wall.map((x) => x.toFixed(5))}`; }
     }
     log(`${SHAPE} at fill ${FILL}: lid radius ${(lidR * S).toFixed(2)} m, ${onRim} of ${sim.count} lid vertices on the rim, none beyond it by more than ${(beyond * S * 1000).toFixed(3)} mm; shell top ring on the lid to ${(seam * S * 1000).toFixed(3)} mm`);
     if (!(beyond < 1e-3 && seam < 1e-3)) throw new Error(`the ${SHAPE} lid leaks: beyond ${beyond} seam ${seam}`);

     // The chord: a probe behind the pool paints the metres of water the eye's
     // ray crossed; the ray through the image centre passes the axis at height
     // yLocal, where the profile says exactly what that chord is.
     const yLocal = SHAPE === 'cone' ? -.5 : shape.centerY;
     // The pool's tiled walls stand at the rim, so the eye and the probe sit
     // just inside it — the segment is the chord clipped to that span.
     const inset = S / 2 - .02;
     const probe = new THREE.Mesh(new THREE.PlaneGeometry(4 * S, 4 * S), new THREE.MeshBasicNodeMaterial());
     // Painted as a fraction of the pool's width (a 100 m pool's chord would
     // saturate a /10 encoding at 10 m).
     const CHORD_SCALE = 2 * S;
     probe.material.colorNode = Fn(() => waterCrossedLengthNode(slot).div(CHORD_SCALE).toVec3())();
     probe.material.fog = false;                 // the medium must not paint over its own reading
     probe.position.set(inset, yLocal * DEPTH, 0); probe.rotation.y = -Math.PI / 2; scene.add(probe);
     pose([-inset, yLocal * DEPTH, 0], [1, yLocal * DEPTH, 0]);
     sim.mesh.visible = false;                   // the reading, not the water in front of it
     const px = await shoot('chord');
     sim.mesh.visible = true;
     // The target is sRGB-encoded; the probe painted a LINEAR value.
     const decode = (v) => { const c = v / 255; return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
     const read = (u) => { const i = ((H >> 1) * W + Math.round(u * W)) * 4; return decode(px[i]) * CHORD_SCALE; };
     const chord = (zOff) => Math.min(2 * inset, 2 * Math.sqrt(Math.max(0, (waterProfileRadius(shape, yLocal) * S) ** 2 - zOff ** 2)));
     // Pixel u ↔ the ray's z offset: the camera is 1.2 S back with a 55° fov; at the axis's distance the half-width is tan(27.5°)·1.2 S·aspect.
     const halfWide = Math.tan(55 / 2 * Math.PI / 180) * inset * (W / H);
     const readings = [0, .15, .3].map((f) => ({ z: f * halfWide, seen: read(.5 + f / 2), expect: chord(f * halfWide) }));
     log(`${SHAPE} chord through the axis: ` + readings.map((r) => `z ${r.z.toFixed(2)} m → ${r.seen.toFixed(2)} m seen, ${r.expect.toFixed(2)} m exact`).join(' · '));
     for (const r of readings) if (!(Math.abs(r.seen - r.expect) < .05 * r.expect + .012 * CHORD_SCALE)) throw new Error(`the medium's chord is wrong: ${r.seen} vs ${r.expect}`);
     log(`${SHAPE} chord: the medium's ray clip is exact`);
     scene.remove(probe);
     pose([-1.1 * S, .55 * S, 1.1 * S], [0, -.3, 0]);
     await shoot('shape-side');
     pose([0, 1.3 * S, .001], [0, 0, 0]);
     await shoot('shape-top');
   }

   // ── GOD RAYS: bright looking up, faint looking down, and STEADY ────────
   //
   // "God rays underwater … not very accurate, flickery" (user, 2026-09-06).
   // The shaft term ALONE: everything but a black probe is hidden, the eye is
   // under water looking up / across / down at the probe, and the frame with
   // the caustic lens on minus the frame with it off is the in-scatter the
   // lens modulates — the god rays and nothing else. Three properties:
   // (a) forward-peaked (Henyey–Greenstein: looking up toward the sun ≫ down),
   // (b) no pixel grain (jittered taps over a mipped map, not noise),
   // (c) no faster than the waves: the change over 0.2 s is a fraction of
   //     the term itself.
   if (S <= 20) {
     const luma = (px, i) => px[i] * .2126 + px[i + 1] * .7152 + px[i + 2] * .0722;
     const shaftOf = (on, off) => { const out = new Float32Array(W * H); for (let i = 0; i < W * H; i++) out[i] = Math.max(0, luma(on, i * 4) - luma(off, i * 4)); return out; };
     const stats = (img) => {
       let mean = 0, grain = 0, count = 0;
       for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
         const i = y * W + x, around = (img[i - 1] + img[i + 1] + img[i - W] + img[i + W]) / 4;
         mean += img[i]; grain += Math.abs(img[i] - around); count++;
       }
       return { mean: mean / count, grain: grain / count };
     };
     const diff = (a, b) => { let d = 0; for (let i = 0; i < a.length; i++) d += Math.abs(a[i] - b[i]); return d / a.length; };
     // The water stays visible — its slot follows the lid's visibility and a
     // hidden lid is a silent medium; the probe sits in front of it anyway.
     const shown = []; scene.traverse((o) => { if (o.isMesh && o.visible && o !== sim.mesh && o !== sim.skirtMesh) { shown.push(o); o.visible = false; } });
     const probe = new THREE.Mesh(new THREE.PlaneGeometry(3 * S, 3 * S), new THREE.MeshBasicNodeMaterial({ color: '#000000', side: THREE.DoubleSide }));
     scene.add(probe);
     const views = {
       up: { eye: [0, -DEPTH + .4, 0], at: [.25, 0, .1], probe: [0, -.4, 0], rot: [Math.PI / 2, 0, 0] },   // below the troughs: the lid must not peek through
       side: { eye: [-2.2, -DEPTH + 1.2, 0], at: [2, -DEPTH + 1.2, 0], probe: [2.4, -DEPTH / 2, 0], rot: [0, -Math.PI / 2, 0] },
       down: { eye: [0, -.5, 0], at: [.25, -DEPTH, .1], probe: [0, -DEPTH + .03, 0], rot: [-Math.PI / 2, 0, 0] },
     };
     const rows = {};
     const lensOn = async (on) => { const p = { ...props, causticIntensity: on ? props.causticIntensity : 0 }; sim.update(p); updateWaterSlot({ engine, slot, kernel: sim.slotKernel, mesh: sim.mesh, simulation: sim, props: p }); for (const fn of engine._tickers) fn(); };
     for (const [name, v] of Object.entries(views)) {
       probe.position.set(...v.probe); probe.rotation.set(...v.rot); pose(v.eye, v.at);
       await lensOn(true); const a = await shoot(`shaft-${name}`);
       await lensOn(false); const off = await shoot(`shaft-${name}-off`);
       await lensOn(true); await run(1); const a1 = await shoot(`shaft-${name}-1f`);
       await run(11); const b = await shoot(`shaft-${name}-0.2s`);
       const sa = shaftOf(a, off), sa1 = shaftOf(a1, off), sb = shaftOf(b, off);
       // Motion is a change that accumulates over frames; flicker is a change
       // that does not: one frame's change against a twelfth of 0.2 s's.
       rows[name] = { ...stats(sa), change: diff(sa, sb), flicker: diff(sa, sa1) / Math.max(1e-3, diff(sa, sb) / 12) };
     }
     scene.remove(probe); for (const o of shown) o.visible = true; await lensOn(true);
     const phase = `${(rows.up.mean / Math.max(.01, rows.side.mean)).toFixed(2)} : 1 : ${(rows.down.mean / Math.max(.01, rows.side.mean)).toFixed(2)}`;
     log(`god rays (the shaft term alone, 8-bit luma): looking up ${rows.up.mean.toFixed(2)}, across ${rows.side.mean.toFixed(2)}, down ${rows.down.mean.toFixed(2)} → phase ${phase}`);
     log(`god rays: grain (|pixel − 4 neighbours|) up ${rows.up.grain.toFixed(3)} across ${rows.side.grain.toFixed(3)} · motion over 0.2 s up ${(rows.up.change / Math.max(.01, rows.up.mean) * 100).toFixed(0)}% across ${(rows.side.change / Math.max(.01, rows.side.mean) * 100).toFixed(0)}% of the term · flicker (one frame's change against a twelfth of 0.2 s's) up ${rows.up.flicker.toFixed(2)} across ${rows.side.flicker.toFixed(2)}`);
     // The caustic map's border: no beam lands there, and it must be NEUTRAL.
     {
       const R = slot.causticTarget.width, px = await renderer.readRenderTargetPixelsAsync(slot.causticTarget, 0, 0, R, R);
       let borderMin = Infinity, interior = 0, n = 0;
       for (let y = 0; y < R; y++) for (let x = 0; x < R; x++) { const v = px[(y * R + x) * 4]; if (x < 2 || y < 2 || x >= R - 2 || y >= R - 2) borderMin = Math.min(borderMin, v); else { interior += v; n++; } }
       log(`caustic map border: minimum ${borderMin.toFixed(3)} against an interior mean of ${(interior / n).toFixed(3)} (an uncovered texel reads 1: no lens, no darkening)`);
       if (!(borderMin > .5)) throw new Error(`the map's border is dark: ${borderMin}`);
     }
     if (!(rows.up.mean > 1.5 * rows.side.mean && rows.up.mean > 1.5 * rows.down.mean)) throw new Error(`the shafts are not forward-peaked: ${phase}`);
     if (!(rows.up.grain < .15 * rows.up.mean + .5)) throw new Error(`the shafts are grainy: ${rows.up.grain} on a mean of ${rows.up.mean}`);
     // 1 is pure translation; a lens pattern also reorganizes, and reads 2–3.3
     // across runs. Grain (noise) would read tens.
     if (!(rows.up.flicker < 4 && rows.side.flicker < 4)) throw new Error(`the shafts flicker: one frame changes ${rows.up.flicker.toFixed(2)}× / ${rows.side.flicker.toFixed(2)}× what smooth motion would`);
   }

   // ── THE RINGS HAVE NO CRACKS ───────────────────────────────────────────
   //
   // Every boundary vertex of level ℓ−1 must land on level ℓ's own surface:
   // on a level-ℓ vertex where the lattices share one, on the midpoint of the
   // two level-ℓ vertices whose edge it sits on otherwise. Read straight off
   // the vertex buffer, in world metres, at the pose where a crack would show.
   if (sim.clip) {
     const M = sim.clip.size, L = sim.clip.levels, M2 = M * M;
     const v = new Float32Array(await renderer.getArrayBufferAsync(sim.mesh.geometry.attributes.position));
     // ⚠ a vec3 storage attribute reads back at a 16-byte stride (4 floats).
     const at = (idx) => [v[idx * 4] * S, v[idx * 4 + 1] * DEPTH, v[idx * 4 + 2] * S];
     const h0 = (M - 1) / 4;
     let worst = 0, checked = 0, worstAt = '';
     for (let level = 1; level < L; level++) {
       for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) {
         if (i !== 0 && i !== M - 1 && j !== 0 && j !== M - 1) continue;
         const fine = at((level - 1) * M2 + j * M + i);
         const pi = i % 2, pj = j % 2, both = pi * pj * 2;
         const ca = [h0 + (i - pi + both) / 2, h0 + (j - pj) / 2], cb = [h0 + (i + pi - both) / 2, h0 + (j + pj) / 2];
         const a = at(level * M2 + ca[1] * M + ca[0]), b = at(level * M2 + cb[1] * M + cb[0]);
         const gap = Math.hypot(fine[0] - (a[0] + b[0]) / 2, fine[1] - (a[1] + b[1]) / 2, fine[2] - (a[2] + b[2]) / 2);
         if (gap > worst) { worst = gap; worstAt = `level ${level - 1} (${i},${j}) fine ${fine.map((x) => x.toFixed(3))} vs coarse ${ca} ${a.map((x) => x.toFixed(3))} + ${cb} ${b.map((x) => x.toFixed(3))}`; }
         checked++;
       }
     }
     log(`clipmap seams: ${checked} boundary vertices over ${L - 1} level joins, worst gap ${(worst * 1000).toFixed(3)} mm (${worstAt})`);
     if (!(worst < .002)) throw new Error(`the rings crack: ${worst} m`);
     // ...and the shell's top edge is the outer level's boundary, vertex for vertex.
     let rimGap = 0;
     for (let k = 0; k < 4 * M; k++) {
       const e = Math.floor(k / M), t = k % M;
       const [ix, iz] = e === 0 ? [t, 0] : e === 1 ? [M - 1, t] : e === 2 ? [M - 1 - t, M - 1] : [0, M - 1 - t];
       const lid = at((L - 1) * M2 + iz * M + ix), wall = at(sim.count + k);
       rimGap = Math.max(rimGap, Math.hypot(lid[0] - wall[0], lid[1] - wall[1], lid[2] - wall[2]));
     }
     log(`clipmap rim: the shell's ${4 * M} top vertices sit on the lid's boundary to ${(rimGap * 1000).toFixed(3)} mm`);
     if (!(rimGap < .002)) throw new Error(`the shell parts from the lid: ${rimGap} m`);
   }

   // ── THE WINDOW, WHERE THERE IS ONE (the pool is wider than it) ─────────
   //
   // Two things the window must not do: show a seam when it moves, and act
   // as a wall where its edge lies in open water. The first as pictures with
   // a number (the frame after a 6 m window step differs from the frame
   // before it by no more than one tick of wave motion does); the second as
   // a ratio (the energy a wake leaves in the east band after it would have
   // bounced off the window's edge — sponge on, against the same run with the
   // sponge off).
   if (sim.ripple.windowed) {
     const w = sim.ripple.resolution, cellM = sim.ripple.cellX * S;
     const meanDiff = (a, b) => { let s = 0; for (let i = 0; i < a.length; i += 4) s += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]); return s / (a.length / 4 * 3); };
     sim.addWaterImpulse(0, 0, radius, -entry / DEPTH);
     await run(18);
     pose([-2.2, 1.8, 2.2], [0, 0, 0]);
     const before = await shoot('window-before');
     await run(1);
     const oneTick = await shoot('window-one-tick');
     sim.followCamera(6 / S, 0);                 // the eye walks 6 m east: ~95 cells
     await run(1);
     const shifted = await shoot('window-shifted');
     const seam = meanDiff(shifted, oneTick), motion = meanDiff(oneTick, before);
     log(`window step of 6 m: frame change ${seam.toFixed(3)} against one tick of wave motion ${motion.toFixed(3)} (centre now ${(sim.rippleCenter.x * S).toFixed(2)} m)`);
     if (seam > 2 * motion + .5) throw new Error(`the window's step shows: ${seam.toFixed(3)} vs ${motion.toFixed(3)}`);

     const bandEnergy = async () => {
       const halves = await renderer.backend.copyTextureToBuffer(sim.rippleTexture, 0, 0, w, w);
       const c = sim.rippleCenter; let sum = 0, count = 0;
       for (let iy = 0; iy < w; iy++) for (let ix = 0; ix < w; ix++) {
         const xm = (c.x + (ix - (w - 1) / 2) * sim.ripple.cellX) * S, zm = (c.y + (iy - (w - 1) / 2) * sim.ripple.cellZ) * S;
         if (xm < 11 || xm > 16 || Math.abs(zm) > 4) continue;
         const h = halfToFloat(halves[(iy * w + ix) * 4]) * DEPTH; sum += h * h; count++;
       }
       return Math.sqrt(sum / Math.max(1, count));
     };
     const strikeNearEdge = async (sponge) => {
       sim.followCamera(0, 0); await run(1);
       sim.sponge = sponge; sim.restart(); await renderer.computeAsync(sim.init); await run(5);
       sim.addWaterImpulse(14 / S, 0, .5 / S, -.3 / DEPTH);   // 2 m inside the east edge of a 32 m window
       if (argument('series', '0') === '1') { for (let k = 1; k <= 8; k++) { await run(24); log(`   sponge ${sponge} t=${(k * .4).toFixed(1)}s band ${(await bandEnergy()).toExponential(2)}`); } sim.restart(); await renderer.computeAsync(sim.init); await run(5); sim.addWaterImpulse(14 / S, 0, .5 / S, -.3 / DEPTH); }
       // A 2-D wave leaves a TAIL behind its front (no Huygens in 2-D), and
       // for the first two seconds the band is that tail in both arms. From
       // 2.0 s the outgoing ring and most of its tail have left the band; a
       // wall's reflected ring is crossing it (12.4 m at 2.0 s, 11.3 m at 2.4 s).
       await run(120); let e = await bandEnergy();
       await run(24); e += await bandEnergy();
       await run(24); e += await bandEnergy();
       return e / 3;
     };
     const absorbed = await strikeNearEdge(true), reflected = await strikeNearEdge(false);
     sim.sponge = true;
     log(`east band after a strike 2 m from the window's edge: sponge ${absorbed.toExponential(2)} m RMS, wall ${reflected.toExponential(2)} m RMS → ${(absorbed / Math.max(1e-9, reflected)).toFixed(2)}x (cells ${(cellM * 100).toFixed(1)} cm)`);
     if (!(absorbed < .5 * reflected)) throw new Error(`the window's edge reflects: ${absorbed} vs ${reflected}`);
     log(`window: a 6 m step is seamless (${seam.toFixed(2)} vs ${motion.toFixed(2)}), and the edge absorbs (${(absorbed / reflected).toFixed(2)}x of a wall)`);
   }
   sim.dispose(renderer);
   engine._waterMedium?.dispose();
 }
 log('validation', errors.length ? errors : 'clean');
 globalThis.__VFX_SMOKE_RESULT__ = { pass: errors.length === 0, images: IMAGES };
 console.log('WATER-PREMIUM PASS');
} catch (error) {
 console.error(error.stack);
 globalThis.__VFX_SMOKE_RESULT__ = { pass: false, error: String(error.stack), images: IMAGES };
}
</script></body></html>
