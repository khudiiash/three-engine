<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GI2 gather — screen probes on the window</title>
    <style>html,body{margin:0;background:#111;color:#ddd;font:13px monospace}canvas{display:none}pre{padding:12px;white-space:pre-wrap}</style>
  </head>
  <body>
    <canvas id="view" width="16" height="16"></canvas>
    <pre id="log"></pre>
    <script type="module">
      // GI2 STAGE 3.1 — THE GATHER, ON A CORNELL BOX.
      //
      // PLAN §5 Stage 3.1's gate is "Cornell: matches the reference render
      // within the same tolerance the SRC path met; no temporal term outside
      // probe space". This page produces the numbers that gate is read from,
      // and every one of them is a RATIO against something computed
      // independently — a CPU path tracer over the same analytic scene, run in
      // the node runner, never a threshold this page could be tuned toward.
      //
      // THE WORLD is `windowFill.js`'s analytic Cornell room (10×6×10 m
      // interior, 5 cm walls, a 2 m box, a 1 m sphere) plus one emissive
      // ceiling panel, voxelized into the §K window. The SAME primitive list
      // builds the three.js geometry the gbuffer is rendered from, so the
      // surface the probes trace and the surface the camera sees are the same
      // surface by construction and not by two descriptions agreeing.
      //
      // THE ROOM IS SEALED. That is not an oversight: the sun and the sky are
      // wired all the way through (uniforms, a DDA shadow ray, a miss colour)
      // and they contribute ≈ 0 inside, which is what a closed room should do
      // and what the reference independently computes. The light in every
      // receipt below is the panel's, arriving through the gather.
      const out = document.querySelector("#log");
      const lines = [];
      const say = (line) => { lines.push(line); out.textContent += line + "\n"; };
      const fail = (error) => {
        const message = error?.stack ?? error?.message ?? String(error);
        say(`FAILED: ${message}`);
        globalThis.__GI2_GATHER_RESULT__ = { pass: false, error: message, text: lines.join("\n") };
      };
      globalThis.addEventListener("error", (event) => fail(event.error ?? event.message));
      globalThis.addEventListener("unhandledrejection", (event) => fail(event.reason));

      try {
        const params = new URLSearchParams(location.search);
        const TIER = params.get("tier") ?? "high";
        const W = Number(params.get("w") ?? 960);
        const Hh = Number(params.get("h") ?? 540);
        // ⚠ THE CONVERGENCE BUDGET FOLLOWS H (§19 3.6). A probe traces 16 of
        // its 64 directions per frame, so a TEXEL is sampled once every four
        // frames: filling `H = 32` samples takes ~128 frames, and a page that
        // read its parity at 160 with H = 4 would be reading a transient with
        // H = 32 — and then blaming the longer memory for it.
        const FRAMES = Number(params.get("frames") ?? 260);
        const COLD_FRAMES = Number(params.get("cold") ?? 96);
        const ORBIT_FRAMES = Number(params.get("orbit") ?? 60);
        const WANT_PNG = params.get("png") !== "0";

        const THREE = await import("three/webgpu");
        const TSL = await import("three/tsl");
        const { Fn, cameraPosition, dot, mrt, normalWorld, positionWorld, sign, vec4 } = TSL;
        const store = await import("/src/modules/gi/window/windowStore.js");
        const fillMod = await import("/src/modules/gi/window/windowFill.js");
        const traceMod = await import("/src/modules/gi/window/windowTrace.js");
        const cacheMod = await import("/src/modules/gi/window/radianceCache.js");
        const gatherMod = await import("/src/modules/gi/window/gatherProbes.js");

        // ══════════════════════════════════════════════════════════ the scene
        //
        // `CORNELL_SCENE` verbatim, plus the panel at palette 0. The fill takes
        // the MINIMUM palette index in a shared cell, so 0 guarantees the panel
        // wins any voxel it shares with the ceiling above it.
        const { CORNELL_SCENE, KIND_BOX, ROOM } = fillMod;
        const PANEL = { kind: KIND_BOX, min: [-1.5, 2.9, -1.5], max: [1.5, 3.0, 1.5], pal: 0 };
        const SCENE = [PANEL, ...CORNELL_SCENE];
        const PANEL_RADIANCE = 8;
        const PALETTE = [
          { albedo: [0.78, 0.78, 0.78], emissive: PANEL_RADIANCE }, // 0 ceiling panel
          { albedo: [0.73, 0.73, 0.73], emissive: 0 }, // 1 floor
          { albedo: [0.73, 0.73, 0.73], emissive: 0 }, // 2 ceiling
          { albedo: [0.63, 0.065, 0.05], emissive: 0 }, // 3 −X wall, red
          { albedo: [0.14, 0.45, 0.091], emissive: 0 }, // 4 +X wall, green
          { albedo: [0.73, 0.73, 0.73], emissive: 0 }, // 5 −Z wall
          { albedo: [0.73, 0.73, 0.73], emissive: 0 }, // 6 +Z wall
          { albedo: [0.73, 0.73, 0.73], emissive: 0 }, // 7 box
          { albedo: [0.73, 0.73, 0.73], emissive: 0 }, // 8 sphere
        ];
        while (PALETTE.length < gatherMod.PAL_ENTRIES) PALETTE.push({ albedo: [0, 0, 0], emissive: 0 });
        const SUN_DIR = (() => { const d = [0.42, -0.83, 0.36]; const l = Math.hypot(...d); return d.map((v) => v / l); })();
        const SUN_COLOR = [3.0, 2.9, 2.6];
        const SKY_COLOR = [0.25, 0.34, 0.5];
        const PANEL_INFO = {
          centre: [0, PANEL.min[1], 0],
          half: [(PANEL.max[0] - PANEL.min[0]) / 2, (PANEL.max[2] - PANEL.min[2]) / 2],
          radiance: [PANEL_RADIANCE, PANEL_RADIANCE, PANEL_RADIANCE],
          area: (PANEL.max[0] - PANEL.min[0]) * (PANEL.max[2] - PANEL.min[2]),
        };

        // ══════════════════════════════════════════════════════════ renderer
        const renderer = new THREE.WebGPURenderer({ canvas: document.querySelector("#view"), trackTimestamp: true });
        await renderer.init();
        if (renderer.backend?.isWebGPUBackend !== true) throw new Error("not a WebGPU backend");
        const device = renderer.backend.device;
        const validationErrors = [];
        device.addEventListener?.("uncapturederror", (e) => {
          validationErrors.push(e.error?.message ?? String(e.error));
          console.error("WebGPU validation error:", validationErrors.at(-1));
        });
        const timestamps = renderer.backend.trackTimestamp === true;
        const storageLimit = device.limits.maxStorageBuffersPerShaderStage;

        // ══════════════════════════════════════════════════════ window + gather
        const win = store.createGiWindow(TIER, { dynamic: false });
        const fill = fillMod.createWindowFill(win, { scene: SCENE });
        const trace = traceMod.createWindowTrace(win, { dynamic: false });
        const cache = cacheMod.createRadianceCache(win);

        // ── the gbuffer (a minimal MRT of our own) ─────────────────────────
        //
        // `giScreen.createGiGBuffer` has the right SHAPE, but importing it
        // drags `giLight`, `rayHitTSL`, `bvhScene` and `reflectionProbes` into
        // a page that needs two attachments and one override material. So the
        // shape is reproduced here and nothing else is loaded: RGBA32F world
        // position with w = "geometry here", RGBA16F world normal, a depth
        // buffer for correct occlusion.
        const gbufferRt = new THREE.RenderTarget(W, Hh, {
          count: 2, depthBuffer: true, stencilBuffer: false, generateMipmaps: false,
          minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
        });
        gbufferRt.textures[0].type = THREE.FloatType;
        gbufferRt.textures[0].name = "output";
        gbufferRt.textures[1].type = THREE.HalfFloatType;
        gbufferRt.textures[1].name = "giNormal";
        const gbufferMat = new THREE.MeshBasicNodeMaterial();
        gbufferMat.name = "gi2 gbuffer";
        gbufferMat.lights = false;
        // FACE THE VIEWER. The wall slabs' inner faces already carry the right
        // outward normal, but a sliver seen from behind would otherwise write
        // an inverted normal — and every consumer (the probe hemisphere, the
        // injection's face id, the resolve's plane test) reads that normal as
        // "which way this surface looks".
        const nFace = normalWorld.mul(sign(dot(normalWorld, cameraPosition.sub(positionWorld))));
        const gbufferMrt = mrt({ output: vec4(positionWorld, 1), giNormal: vec4(nFace, 0) });

        const gather = gatherMod.createGiGather({
          win, trace, cache,
          positionTexture: gbufferRt.textures[0],
          normalTexture: gbufferRt.textures[1],
          width: W, height: Hh, tier: TIER, crops: 24,
        });
        gather.setPalette(PALETTE);
        const gu = gather.uniforms;
        // ⭐ `?dom=0` RUNS THIS WHOLE PAGE AS STAGE 3.8 DID. Every gate below —
        // parity, noise, motion, the kernel table — then reads the pre-3.9
        // attribution rule out of the SAME binary at the same resolution on the
        // same GPU, which is the only way to answer "did the fix move a number
        // that has nothing to do with it" without a second checkout.
        const DOM_ON = params.get("dom") !== "0";
        const ROT_ON = params.get("rot") !== "0";
        gu.domFaceOn.value = DOM_ON ? 1 : 0;
        gu.sunDir.value.set(...SUN_DIR);
        gu.sunColor.value.set(...SUN_COLOR);
        gu.skyColor.value.set(...SKY_COLOR);
        gu.panelCentre.value.set(...PANEL_INFO.centre);
        gu.panelHalf.value.set(...PANEL_INFO.half);
        gu.panelRadiance.value.set(...PANEL_INFO.radiance);
        gu.panelArea.value = PANEL_INFO.area;

        const wd = win.describe();
        const cd = cache.describe();
        const gd = gather.describe();
        say(`tier ${TIER}: window ${wd.levels}×64³ @ ${wd.voxel0} m = ${wd.totalMB} MB; ` +
          `cache ${cd.bricks} bricks × ${cd.slotBytes} B = ${cd.totalMB} MB`);
        say(`gather: ${gd.width}×${gd.height}, tile ${gd.tile} → ${gd.probeW}×${gd.probeH} = ${gd.probeCount} probes, ` +
          `${gd.rays} rays/probe/frame over an ${gd.oct}×${gd.oct} oct map (stride ${gd.stride}), H=${gd.history}, ` +
          `SH filter ${2 * gd.shRadius + 1}×${2 * gd.shRadius + 1}, resolve=${gd.sh ? "SH2" : "oct sum"}`);
        say(`gather buffers: ${Object.entries(gd.bytes).map(([k, v]) => `${k} ${(v / 1048576).toFixed(2)}MB`).join(", ")}`);

        // ══════════════════════════════════════════════════════ three.js scene
        const scene = new THREE.Scene();
        const mkMesh = (p, R = null) => {
          let geo;
          if (p.kind === fillMod.KIND_SPHERE) {
            const r = (p.max[0] - p.min[0]) / 2;
            geo = new THREE.SphereGeometry(r, 48, 32);
            geo.translate((p.min[0] + p.max[0]) / 2, (p.min[1] + p.max[1]) / 2, (p.min[2] + p.max[2]) / 2);
          } else {
            geo = new THREE.BoxGeometry(p.max[0] - p.min[0], p.max[1] - p.min[1], p.max[2] - p.min[2]);
            geo.translate((p.min[0] + p.max[0]) / 2, (p.min[1] + p.max[1]) / 2, (p.min[2] + p.max[2]) / 2);
          }
          // ⭐ §19 STAGE 3.9 — A `KIND_OBB`'s min/max are LOCAL, so the raster
          // geometry is turned by the SAME matrix the fill's uniform carries.
          // The gbuffer the probes read and the voxels they trace are then one
          // surface by construction, which is the whole reason this page builds
          // its meshes from the fill's primitive list instead of a second
          // description of the room.
          if (p.kind === fillMod.KIND_OBB && R) {
            geo.applyMatrix4(new THREE.Matrix4().set(
              R[0][0], R[1][0], R[2][0], 0,
              R[0][1], R[1][1], R[2][1], 0,
              R[0][2], R[1][2], R[2][2], 0,
              0, 0, 0, 1,
            ));
          }
          const m = new THREE.Mesh(geo, new THREE.MeshBasicNodeMaterial());
          m.frustumCulled = false;
          return m;
        };
        const buildMeshes = (prims, R = null) => {
          for (const c of [...scene.children]) { scene.remove(c); c.geometry?.dispose(); c.material?.dispose(); }
          for (const p of prims) scene.add(mkMesh(p, R));
        };
        buildMeshes(SCENE);

        const VFOV = 80;
        const camera = new THREE.PerspectiveCamera(VFOV, W / Hh, 0.05, 120);
        const projScale = (Hh / 2) / Math.tan((VFOV * Math.PI) / 360);
        gu.projScale.value = projScale;

        const CAM_EYE = [0, -0.5, 4.8];
        const CAM_IN = { eye: CAM_EYE, at: [0, -0.6, 0] }; // the panel is in frame
        const CAM_OUT = { eye: CAM_EYE, at: [0, -2.8, 0] }; // pitched down, panel gone
        const setCam = (c) => {
          camera.position.set(...c.eye);
          camera.lookAt(...c.at);
          camera.updateMatrixWorld(true);
          camera.updateProjectionMatrix();
        };

        const vp = new THREE.Matrix4();
        const prevVp = new THREE.Matrix4();
        const project = (p) => {
          const v = new THREE.Vector3(...p).applyMatrix4(vp);
          return { x: (v.x * 0.5 + 0.5) * W, y: (1 - (v.y * 0.5 + 0.5)) * Hh };
        };
        const onScreen = (q) => q.x >= 0 && q.x < W && q.y >= 0 && q.y < Hh;

        // ══════════════════════════════════════════════════════ the frame
        const compute = (p) => renderer.computeAsync(p);
        const renderGbuffer = async () => {
          const prevTarget = renderer.getRenderTarget();
          const prevMRT = renderer.getMRT();
          scene.overrideMaterial = gbufferMat;
          renderer.setMRT(gbufferMrt);
          renderer.setRenderTarget(gbufferRt);
          renderer.setClearColor(0x000000, 0);
          await renderer.renderAsync(scene, camera);
          renderer.setRenderTarget(prevTarget);
          renderer.setMRT(prevMRT);
          scene.overrideMaterial = null;
        };

        let placedAt = null;
        let lastRefilled = false;
        const placeWindow = async (force = false) => {
          lastRefilled = false;
          const p = [camera.position.x, camera.position.y, camera.position.z];
          if (!force && placedAt && p.every((v, i) => Math.abs(v - placedAt[i]) < 1e-6)) return false;
          const receipt = win.setCamera(p);
          placedAt = p;
          if (!receipt.scrolled && !force) return false;
          lastRefilled = true;
          await compute(win.statsResetPass);
          await compute(win.scrollPass);
          await compute(win.clearStaticPass);
          await compute(fill.pass);
          await compute(cache.allocPass);
          return true;
        };

        const frameChain = (statsOn) => {
          gu.statsOn.value = statsOn ? 1 : 0;
        };
        // §19 3.6's SH-filter WIDTH arm. The radius is compiled in (the
        // neighbour offsets are unrolled in JS), so the A/B is a choice of
        // KERNEL rather than of uniform — `runFrame` dispatches whichever this
        // says, and everything downstream reads the same `shIdx` half.
        let SH3 = false;

        const runFrame = async (n, opts = {}) => {
          gather.beginFrame(n);
          camera.updateMatrixWorld(true);
          vp.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          gu.prevViewProj.value.copy(n === 0 ? vp : prevVp);
          gu.viewProj.value.copy(vp);
          gu.camPos.value.copy(camera.position);
          await placeWindow();
          await renderGbuffer();
          await compute(gather.passes.hzbBuild);
          for (const p of gather.passes.hzbReduce) await compute(p);
          await compute(gather.passes.probePlace);
          // §19 Stage 3.7 P.3: the one-thread allocator, between the placement
          // that classifies the probes and the trace that spends the rays.
          await compute(gather.passes.rayBudget);
          await compute(gather.passes.probeTrace);
          await compute(gather.passes.probeFilter);
          await compute(SH3 ? gather.passes.probeShFilter3 : gather.passes.probeShFilter);
          await compute(gather.passes.resolveHalf);
          await compute(gather.passes.resolveUpsample);
          await compute(gather.passes.composite);
          if (opts.inject !== false) await compute(gather.passes.inject);
          prevVp.copy(vp);
        };

        // ── crop plumbing ─────────────────────────────────────────────────
        // The first eight are §3.1's receipts and their names are load-bearing
        // (the node runner's parity table keys off them). The `wallLadder`
        // rows below them are §3.2 item 4's instrument: the same wall, the
        // same z, at eight HEIGHTS straddling the camera's own (−0.5), so a
        // "horizontal tone step at camera height" is a number and not an
        // impression. `sphereEdge` is the crescent item 2 is about — the crop
        // named `sphere` sits where the bias already escapes the voxelization.
        const CROPS = [
          { name: "redWall", p: [-4.99, -0.5, -1.0] },
          { name: "greenWall", p: [4.99, -0.5, -1.0] },
          { name: "floorCentre", p: [0, -2.99, 1.0] },
          { name: "floorSpot", p: [0, -2.99, 0.0] },
          { name: "floorRed", p: [-4.2, -2.99, 0.0] },
          { name: "floorGreen", p: [4.2, -2.99, 0.0] },
          { name: "boxTop", p: [-2.0, -0.99, -1.5] },
          { name: "sphere", p: [2.0, -2.4, 1.9] },
          { name: "sphereEdge", p: [2.30, -2.24, 1.79], diag: true },
          { name: "panelSide", p: [0.0, 2.95, 1.5], diag: true },
          ...[-2.0, -1.5, -1.0, -0.75, -0.25, 0.0, 0.5, 1.0].map((y) => ({
            name: `wall@${y.toFixed(2)}`, p: [-4.99, y, -1.0], diag: true,
          })),
        ];
        const cropArr = gather.buffers.cropIn.value.array;
        // `xf` turns a crop's world point with the arm's rotation, so the SAME
        // eight named places on the SAME eight surfaces are read in every arm —
        // the ratios are then comparable because the surface is the same one,
        // not because the coordinates happen to be.
        const writeCrops = (xf = (p) => p) => {
          const meta = [];
          CROPS.forEach((c, i) => {
            const wp = xf(c.p);
            const q = project(wp);
            cropArr[i * 4] = Math.round(q.x);
            cropArr[i * 4 + 1] = Math.round(q.y);
            cropArr[i * 4 + 2] = 0;
            cropArr[i * 4 + 3] = 0;
            meta.push({
              name: c.name, want: wp, px: Math.round(q.x), py: Math.round(q.y),
              onScreen: onScreen(q), diag: !!c.diag,
            });
          });
          gather.buffers.cropIn.value.needsUpdate = true;
          return meta;
        };
        const readCrops = async () => {
          await compute(gather.passes.crop);
          const f = new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.cropOut.value));
          return CROPS.map((c, i) => {
            const b = i * 6 * 4;
            return {
              name: c.name, diag: !!c.diag,
              px: cropArr[i * 4], py: cropArr[i * 4 + 1],
              pos: [f[b], f[b + 1], f[b + 2]], samples: f[b + 3],
              nrm: [f[b + 4], f[b + 5], f[b + 6]],
              irr: [f[b + 8], f[b + 9], f[b + 10]],
              glossy: [f[b + 12], f[b + 13], f[b + 14]],
              lit: [f[b + 16], f[b + 17], f[b + 18]],
              albedo: [f[b + 20], f[b + 21], f[b + 22]], emissive: f[b + 23],
            };
          });
        };
        const readStats = async () => gather.readStats(
          new Uint32Array(await renderer.getArrayBufferAsync(gather.buffers.statsBuf.value)),
        );
        const lum = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

        /**
         * What the cache actually holds — the colour-probe method applied to a
         * buffer: count the map entries that own a slot and the slot words that
         * carry radiance, so "the cache is not working" can never be a theory
         * about which of the two halves is broken.
         */
        const cacheHealth = async () => {
          const u32 = new Uint32Array(await renderer.getArrayBufferAsync(cache.attribute));
          let mapped = 0;
          for (let i = 0; i < win.levels * 4096; i++) if (u32[cache.MAP_OFF + i]) mapped++;
          let written = 0;
          const scan = Math.min(cache.DATA_OFF + mapped * 384 + 4096, cache.MAP_OFF);
          for (let i = cache.DATA_OFF; i < scan; i++) if (u32[i]) written++;
          return { ...cache.readControl(u32), mapped, writtenWords: written, scanned: scan };
        };

        // ══════════════════════ THE NOISE RECEIPT (§19 STAGE 3.6) ════════════
        //
        // ⭐⭐ "GI IS NOISY" IS A REPORT ABOUT A TEXTURE, AND EVERY INSTRUMENT ON
        // THIS PAGE READ A CROP. A crop is a 9×9 block averaged into one
        // number — a low-pass filter applied to the exact quantity under
        // complaint — and the mottling scan is a 33-px band of ONE wall. So
        // before any lever is pulled there is a number for the thing itself,
        // over every lit pixel, in two independent axes:
        //
        //   TEMPORAL  per-pixel σ over 30 consecutive frames ÷ that pixel's
        //             own mean, with the camera parked. This is what "it
        //             crawls / it boils" is. Reported p50 / p95.
        //   SPATIAL   |L − (its own 5×5 box mean)| ÷ the box mean, per frame,
        //             over lit pixels that are NOT on a geometric edge. This
        //             is what "it is blotchy" is. Reported p50 / p95.
        //
        // ⚠ AND THE BAR IS SET FROM FIRST PRINCIPLES, NOT FROM THE SRC PATH.
        // `test:gi-src-gather` reports a frameMean spread, which is a mean of
        // means — it cannot see per-pixel variance at all, so it cannot supply
        // this number and quoting it would be a blind statistic. The gate is
        // therefore argued: 1 % temporal at p95 is below the ~1.5 % contrast
        // step 8-bit sRGB can display in the midtones, so a pixel that moves
        // less than that cannot be seen to move; 3 % spatial at p95 is the
        // same argument with the eye's spatial contrast sensitivity peak
        // (~3 % at 4 cycles/degree) in place of the display's quantum.
        //
        // Percentiles come out of a LOG-SPACED HISTOGRAM rather than a sort:
        // 1.6 M pixels × 30 frames is 48 M samples and a sort per frame would
        // be most of this page's wall time.
        const HIST_BINS = 2048; const HIST_LO = 1e-5; const HIST_HI = 100;
        const HIST_K = Math.log(HIST_HI / HIST_LO);
        const mkHist = () => ({ bins: new Float64Array(HIST_BINS), n: 0 });
        const histAdd = (h, v) => {
          const t = Math.log(Math.min(HIST_HI, Math.max(HIST_LO, v)) / HIST_LO) / HIST_K;
          h.bins[Math.min(HIST_BINS - 1, Math.max(0, Math.floor(t * HIST_BINS)))]++;
          h.n++;
        };
        const histP = (h, p) => {
          if (!h.n) return null;
          const want = (h.n * p) / 100;
          let c = 0;
          for (let i = 0; i < HIST_BINS; i++) {
            c += h.bins[i];
            if (c >= want) return HIST_LO * Math.exp(HIST_K * ((i + 0.5) / HIST_BINS));
          }
          return HIST_HI;
        };
        const NPX = W * Hh;
        const noiseFrame = async () => {
          await compute(gather.passes.noiseDump);
          return new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.noiseBuf.value));
        };
        /**
         * Both receipts over `frames` frames. `advance(k)` runs the frame (so
         * the same instrument serves the parked arm and the orbiting one).
         *
         * "Lit" is derived from the scene, never a constant: the threshold is
         * a tenth of the MEDIAN box-mean over the valid pixels of the first
         * frame, so a dark room and a bright one are judged the same way.
         */
        const noiseReceipt = async (label, {
          frames = 30, advance = null, quiet = false, probeSpace = false,
        } = {}) => {
          const sum = new Float64Array(NPX);
          const sq = new Float64Array(NPX);
          const cnt = new Uint16Array(NPX);
          const spatial = [];
          let lit = null;
          // Probe-space, the same two axes on the SH DC term.
          const shSum = new Float64Array(gd.probeCount);
          const shSq = new Float64Array(gd.probeCount);
          const shCnt = new Uint16Array(gd.probeCount);
          const shSpatial = [];
          for (let k = 0; k < frames; k++) {
            if (advance) await advance(k);
            const f = await noiseFrame();
            if (lit == null) {
              const h = mkHist();
              for (let i = 0; i < NPX; i++) if (f[i * 4 + 3] > 0.5) histAdd(h, f[i * 4 + 1]);
              lit = 0.1 * (histP(h, 50) ?? 0);
            }
            const hp = mkHist();
            for (let i = 0; i < NPX; i++) {
              if (!(f[i * 4 + 3] > 0.5)) continue;
              const L = f[i * 4]; const B = f[i * 4 + 1];
              if (!(B > lit)) continue;
              sum[i] += L; sq[i] += L * L; cnt[i]++;
              if (f[i * 4 + 2] < 0.5) histAdd(hp, Math.abs(L - B) / B);
            }
            spatial.push({ p50: histP(hp, 50), p95: histP(hp, 95), n: hp.n });
            // ── (c) the same two on the probe SH DC term ──────────────────
            //
            // ⚠ TWO MORE READBACKS A FRAME, so it is asked for and not always
            // paid: the pixel receipt is the one the user's report is about,
            // and the probe-space pair only says whether the noise is BORN in
            // probe space or made by the resolve.
            if (!probeSpace) continue;
            const meta = new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.probeMeta.value));
            const sh = new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.probeSh.value));
            const half = gather.frame & 1;
            const dc = new Float64Array(gd.probeCount);
            for (let p = 0; p < gd.probeCount; p++) {
              const b = p * 9 * 4;
              dc[p] = lum([sh[b], sh[b + 1], sh[b + 2]]);
              const mb = (half * gd.probeCount * 3 + p * 3) * 4;
              if (meta[mb + 3] > 0.5 && dc[p] > 0) { shSum[p] += dc[p]; shSq[p] += dc[p] * dc[p]; shCnt[p]++; }
            }
            const sh5 = mkHist();
            for (let py = 0; py < gd.probeH; py++) {
              for (let px2 = 0; px2 < gd.probeW; px2++) {
                const p = py * gd.probeW + px2;
                const mb = (half * gd.probeCount * 3 + p * 3) * 4;
                if (!(meta[mb + 3] > 0.5) || !(dc[p] > 0)) continue;
                const P = [meta[mb], meta[mb + 1], meta[mb + 2]];
                const Nn = [meta[mb + 4], meta[mb + 5], meta[mb + 6]];
                let s = 0; let n2 = 0; let edge = false;
                for (let oy = -2; oy <= 2 && !edge; oy++) {
                  for (let ox = -2; ox <= 2; ox++) {
                    const qx = px2 + ox; const qy = py + oy;
                    if (qx < 0 || qy < 0 || qx >= gd.probeW || qy >= gd.probeH) { edge = true; break; }
                    const q = qy * gd.probeW + qx;
                    const qb = (half * gd.probeCount * 3 + q * 3) * 4;
                    const dotN = Nn[0] * meta[qb + 4] + Nn[1] * meta[qb + 5] + Nn[2] * meta[qb + 6];
                    const plane = Math.abs(Nn[0] * (meta[qb] - P[0]) + Nn[1] * (meta[qb + 1] - P[1])
                      + Nn[2] * (meta[qb + 2] - P[2]));
                    if (!(meta[qb + 3] > 0.5) || dotN < 0.95 || plane > wd.voxel0) { edge = true; break; }
                    s += dc[q]; n2++;
                  }
                }
                if (edge || n2 < 25) continue;
                const m = s / n2;
                if (m > 0) histAdd(sh5, Math.abs(dc[p] - m) / m);
              }
            }
            shSpatial.push({ p50: histP(sh5, 50), p95: histP(sh5, 95), n: sh5.n });
          }
          const tempHist = mkHist();
          for (let i = 0; i < NPX; i++) {
            if (cnt[i] < frames) continue;
            const m = sum[i] / cnt[i];
            if (!(m > 0)) continue;
            const v = Math.max(0, sq[i] / cnt[i] - m * m);
            histAdd(tempHist, Math.sqrt(v) / m);
          }
          const shTemp = mkHist();
          for (let p = 0; p < gd.probeCount; p++) {
            if (shCnt[p] < frames) continue;
            const m = shSum[p] / shCnt[p];
            if (!(m > 0)) continue;
            const v = Math.max(0, shSq[p] / shCnt[p] - m * m);
            histAdd(shTemp, Math.sqrt(v) / m);
          }
          const medOf = (xs) => xs.slice().sort((a, b) => a - b)[Math.floor(xs.length / 2)];
          const out = {
            label, frames, litThreshold: lit,
            temporal: { p50: histP(tempHist, 50), p95: histP(tempHist, 95), n: tempHist.n },
            spatial: {
              p50: medOf(spatial.map((s) => s.p50)), p95: medOf(spatial.map((s) => s.p95)),
              n: spatial[0]?.n ?? 0, perFrame: spatial,
            },
            shTemporal: { p50: histP(shTemp, 50), p95: histP(shTemp, 95), n: shTemp.n },
            shSpatial: {
              p50: medOf(shSpatial.map((s) => s.p50)), p95: medOf(shSpatial.map((s) => s.p95)),
              n: shSpatial[0]?.n ?? 0,
            },
          };
          const pc = (v) => (v == null ? "  n/a" : `${(100 * v).toFixed(2)} %`);
          if (!quiet) {
            say(`  NOISE [${label}] irradiance: temporal p50 ${pc(out.temporal.p50)} p95 ${pc(out.temporal.p95)} ` +
              `(${out.temporal.n} px over ${frames} frames) | spatial p50 ${pc(out.spatial.p50)} ` +
              `p95 ${pc(out.spatial.p95)} (${out.spatial.n} px/frame, edges excluded)`);
            say(`  NOISE [${label}] probe SH DC: temporal p50 ${pc(out.shTemporal.p50)} p95 ${pc(out.shTemporal.p95)} ` +
              `(${out.shTemporal.n} probes) | spatial p50 ${pc(out.shSpatial.p50)} p95 ${pc(out.shSpatial.p95)} ` +
              `(${out.shSpatial.n} probes)`);
          }
          return out;
        };

        const results = {
          tier: TIER, width: W, height: Hh, storageLimit, timestamps,
          window: wd, cacheDesc: cd, gather: gd,
          scene: SCENE, palette: PALETTE,
          light: { sunDir: SUN_DIR, sunColor: SUN_COLOR, sky: SKY_COLOR, panel: PANEL_INFO, panelBox: PANEL },
          room: ROOM,
        };

        // ══════════════════════════════════════════ cold start + first light
        setCam(CAM_IN);
        await placeWindow(true);
        await compute(cache.clearPass);
        await compute(cache.allocPass);
        await compute(gather.passes.clearProbes);
        await compute(gather.passes.clearMeta);
        await compute(gather.passes.clearStats);
        frameChain(true);

        {
          const buf = new Uint32Array(await renderer.getArrayBufferAsync(win.attribute));
          let occ = 0;
          for (let l = 0; l < win.levels; l++) {
            const base = l * store.LEVEL_WORDS + store.OCC_OFF;
            for (let w = 0; w < store.OCC_WORDS; w++) { let v = buf[base + w]; while (v) { occ += v & 1; v >>>= 1; } }
          }
          const ctl = await cacheHealth();
          say(`fill: ${occ} occupied voxels; cache slots allocated ${ctl.allocated} (overflow ${ctl.overflow}), ` +
            `map entries owning a slot ${ctl.mapped}`);
          results.fill = { occupiedVoxels: occ, cache: ctl };
          if (occ < 1000) throw new Error(`the fill produced ${occ} occupied voxels — the window is empty`);
          if (ctl.allocated < 100) throw new Error(`the cache allocated ${ctl.allocated} slots — no brick reads BUILT`);
        }

        // A sanity check the receipts below all depend on: the projection this
        // page uses to place crops must agree with the gbuffer the kernels
        // read. Project a known world point, sample the gbuffer there, and
        // require the world position that comes back to be the point — this is
        // the screen-Y sign error that has cost this project a session before.
        await runFrame(0);
        {
          const meta = writeCrops();
          const c = await readCrops();
          const probe = c.find((x) => x.name === "floorCentre");
          const wantP = CROPS.find((x) => x.name === "floorCentre").p;
          const err = Math.hypot(probe.pos[0] - wantP[0], probe.pos[1] - wantP[1], probe.pos[2] - wantP[2]);
          say(`projection sanity: floorCentre wants ${wantP.map((v) => v.toFixed(2))}, gbuffer at that pixel is ` +
            `${probe.pos.map((v) => v.toFixed(2))} (err ${err.toFixed(3)} m)`);
          results.projectionSanity = { want: wantP, got: probe.pos, err, crops: meta };
          if (!(err < 0.35)) throw new Error(`the crop pixel does not land on its world point (err ${err.toFixed(3)} m) — projection or row order is wrong`);
        }

        // ── time to first light ───────────────────────────────────────────
        const firstLight = { series: [] };
        for (let n = 1; n <= COLD_FRAMES; n++) {
          await runFrame(n);
          if (n % 2 === 0 || n <= 8) {
            writeCrops();
            const c = await readCrops();
            firstLight.series.push({ frame: n, floorSpot: lum(c.find((x) => x.name === "floorSpot").irr) });
          }
        }
        // Converge, then look back for the crossing.
        for (let n = COLD_FRAMES + 1; n <= FRAMES; n++) await runFrame(n);
        writeCrops();
        const converged = await readCrops();
        const convergedFloor = lum(converged.find((x) => x.name === "floorSpot").irr);
        firstLight.converged = convergedFloor;
        firstLight.frame = firstLight.series.find((s) => s.floorSpot > 0.5 * convergedFloor)?.frame ?? null;
        // 50 % is reached almost immediately because §L.4's 3×3 filter pools
        // nine probes whose texel ROTATIONS differ, so a probe's map is largely
        // covered after one frame even though it traced 16 of 64 directions.
        // The 90 % crossing is the number that describes convergence.
        firstLight.frame90 = firstLight.series.find((s) => s.floorSpot > 0.9 * convergedFloor)?.frame ?? null;
        say(`time to first light: floor spot reaches 50 % of its converged irradiance ` +
          `(${convergedFloor.toFixed(4)}) at frame ${firstLight.frame ?? "never"}, 90 % at frame ` +
          `${firstLight.frame90 ?? "never"} ` +
          `[${firstLight.series.slice(0, 10).map((s) => s.floorSpot.toFixed(3)).join(" ")} …]`);
        results.firstLight = firstLight;

        // ══════════════════════════════════════════ Cornell parity (in frame)
        const cropMeta = writeCrops();
        const inFrame = await readCrops();
        const statsIn = await readStats();
        const cacheAfter = await cacheHealth();
        results.cacheAfter = cacheAfter;
        say(`cache after ${FRAMES} frames: ${cacheAfter.mapped} bricks own a slot, ` +
            `${cacheAfter.writtenWords} of ${cacheAfter.scanned - cache.DATA_OFF} scanned words carry radiance`);
        results.cornell = { crops: inFrame, cropMeta, stats: statsIn, frames: FRAMES };
        say(`probes ${statsIn.probesValid}/${statsIn.probesPlaced} valid, reprojection ` +
          `${(100 * statsIn.reprojHits / Math.max(1, statsIn.probesValid)).toFixed(1)} %; ` +
          `rays ${statsIn.raysTraced}/${statsIn.raysLaunched} (${(100 * statsIn.raysTraced / Math.max(1, statsIn.raysLaunched)).toFixed(1)} % yield), ` +
          `screen ${statsIn.screenHits} / window ${statsIn.windowHits} / sky ${statsIn.skyMiss}, ` +
          `fresh shades ${statsIn.freshShades}, hand-offs ${statsIn.handoffs}, injected ${statsIn.injectWrites}`);
        say(`hysteresis: the history was RESET on ${statsIn.alphaForced} of ${statsIn.raysTraced} traced rays = ` +
          `${(100 * statsIn.alphaForced / Math.max(1, statsIn.raysTraced)).toFixed(2)} % — with a parked camera and a ` +
          `static world this number is the rate at which the estimator throws away its own history on SHOT NOISE, ` +
          `and it should be ~0`);
        say(`texel maturity: ${statsIn.matureTexels} of ${statsIn.texelsSeen} sampled texels have n >= H/2 = ` +
          `${(100 * statsIn.matureTexels / Math.max(1, statsIn.texelsSeen)).toFixed(1)} % (H = ${gd.history})`);
        {
          // ⭐ A RATE NAMES NO MECHANISM. `probesValid − reprojHits` is split
          // into the five gates that can refuse a carry, and the split must
          // ADD UP — a census that does not is blind to a sixth reason.
          const miss = statsIn.probesValid - statsIn.reprojHits;
          const cls = {
            offScreen: statsIn.reprojOffScreen, noPrev: statsIn.reprojNoPrev,
            plane: statsIn.reprojPlane, slant: statsIn.reprojSlant, align: statsIn.reprojAlign,
          };
          const sum = Object.values(cls).reduce((a, x) => a + x, 0);
          say(`reprojection census: ${statsIn.reprojHits}/${statsIn.probesValid} carried = ` +
            `${(100 * statsIn.reprojHits / Math.max(1, statsIn.probesValid)).toFixed(2)} %; the ${miss} misses are ` +
            Object.entries(cls).map(([k, v]) => `${k} ${v}`).join(", ") +
            ` (sum ${sum}${sum === miss ? "" : ` ≠ ${miss} — THE CENSUS IS BLIND`})`);
          results.reprojCensus = { ...cls, miss, sum, hits: statsIn.reprojHits, valid: statsIn.probesValid };
        }
        for (const c of inFrame.filter((x) => !x.diag)) {
          say(`  ${c.name.padEnd(12)} pos ${c.pos.map((v) => v.toFixed(2)).join(",").padEnd(20)} ` +
            `E ${c.irr.map((v) => v.toFixed(3)).join(" ")}  albedo ${c.albedo.map((v) => v.toFixed(2)).join(" ")}  ` +
            `${c.samples} px`);
        }

        // ══════════════════════ THE COLOUR PROBE, STAGE BY STAGE (§3.2)
        //
        // ⭐ READ BACK EVERY STAGE; THE FIRST WRONG ONE IS THE SOURCE. A crop
        // that comes out dark can be dark for four different reasons with one
        // symptom: its probes were ANCHORED on another surface, their rays hit
        // nothing (or hit themselves), the 3×3 filter pooled probes off this
        // plane, or the resolve weighted them all to zero and fell back. The
        // audit walks the pipeline in that order and prints, per crop, the
        // four probes the resolve will actually use, with the trace evidence
        // (texel fill, SELF-HIT fraction from the hit distance the alpha
        // carries, sky fraction) beside the resolve's own weights.
        const OCT_TBL = gatherMod.octTable(gd.oct).map((v) => [v.x, v.y, v.z, v.w]);
        const OCTN = gd.oct * gd.oct;
        /**
         * The oct texel's alpha, unpacked — the CPU mirror of `PACK_N` (§19
         * 3.6). Every constant comes out of `describe()` so this cannot drift
         * from the kernel that packed the word: n·2^18 + distQ·2^10 + sigQ,
         * with σ LOG-quantized (see the note in gatherProbes.js).
         */
        const unpackAlpha = (a) => {
          if (!(a > 0)) return { nS: 0, dist: 0, sigRel: 0 };
          const nS = Math.floor(a / gd.packN);
          const rem = a - nS * gd.packN;
          const dq = Math.floor(rem / gd.packD);
          const sq = rem - dq * gd.packD;
          return {
            nS,
            dist: dq * (gd.rayMax / gd.distQ),
            sigRel: gd.sigMin * Math.pow(2, (sq / gd.sigQ) * gd.sigOct),
          };
        };
        const dumpBuffers = async () => ({
          half: gather.frame & 1,
          meta: new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.probeMeta.value)),
          raw: new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.probeOct.value)),
          filt: new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.probeFiltered.value)),
          sh: new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.probeSh.value)),
        });
        /** Everything knowable about one probe, from the three buffers. */
        const probeStat = (D, pi, N) => {
          const mb = (D.half * gd.probeCount * 3 + pi * 3) * 4;
          const pos = [D.meta[mb], D.meta[mb + 1], D.meta[mb + 2]];
          const valid = D.meta[mb + 3];
          const nrm = [D.meta[mb + 4], D.meta[mb + 5], D.meta[mb + 6]];
          const depth = D.meta[mb + 7];
          const prev = D.meta[mb + 8];
          let fill = 0; let self = 0; let sky = 0; let dsum = 0; let nsum = 0; let sgsum = 0;
          // ⚠ A MEAN HIT DISTANCE CANNOT SEE A BIMODAL POPULATION. "d̄ = 4 m"
          // is what 90 % of rays stopped at 0.3 m and 10 % at 38 m looks like,
          // and those are two completely different diagnoses. Near and far are
          // counted, and their radiance averaged, separately.
          let near = 0; let nearL = 0; let farL = 0;
          const texels = [];
          const Er = [0, 0, 0]; const Ef = [0, 0, 0];
          for (let t = 0; t < OCTN; t++) {
            // TEXEL-MAJOR, mirroring `octIdx` — see gatherProbes.js.
            const ob = (D.half * gd.probeCount * OCTN + t * gd.probeCount + pi) * 4;
            const a = D.raw[ob + 3];
            const { nS, dist, sigRel } = unpackAlpha(a);
            if (nS > 0) {
              fill++; dsum += dist; nsum += nS; sgsum += sigRel;
              if (dist < 0.2) self++;
              if (dist > 39) sky++;
              const l = lum([D.raw[ob], D.raw[ob + 1], D.raw[ob + 2]]);
              if (dist < 1.0) { near++; nearL += l; } else { farL += l; }
              const e0 = OCT_TBL[t];
              texels.push({
                t, dir: [e0[0], e0[1], e0[2]], dw: e0[3],
                dist: +dist.toFixed(3), L: +l.toFixed(4), n: nS, sig: +sigRel.toFixed(4),
              });
            }
            const e = OCT_TBL[t];
            const c = e[0] * N[0] + e[1] * N[1] + e[2] * N[2];
            if (c > 0) {
              const fb = (t * gd.probeCount + pi) * 4;
              for (let k = 0; k < 3; k++) { Er[k] += D.raw[ob + k] * c * e[3]; Ef[k] += D.filt[fb + k] * c * e[3]; }
            }
          }
          // The SH2 evaluation the shipped resolve now does, mirrored exactly.
          const L = [];
          for (let i = 0; i < 9; i++) { const b = (pi * 9 + i) * 4; L.push([D.sh[b], D.sh[b + 1], D.sh[b + 2]]); }
          const c1 = 0.429043; const c2 = 0.511664; const c3 = 0.743125;
          const c4 = 0.886227; const c5 = 0.247708;
          const Esh = [0, 1, 2].map((k) => Math.max(0,
            c1 * L[8][k] * (N[0] * N[0] - N[1] * N[1]) + c3 * L[6][k] * N[2] * N[2] + c4 * L[0][k] - c5 * L[6][k]
            + 2 * c1 * (L[4][k] * N[0] * N[1] + L[7][k] * N[0] * N[2] + L[5][k] * N[1] * N[2])
            + 2 * c2 * (L[3][k] * N[0] + L[1][k] * N[1] + L[2][k] * N[2])));
          return {
            pi, pos, nrm, valid, depth, prev, fill, self, sky, near, texels,
            nearL: near ? nearL / near : 0, farL: fill - near ? farL / (fill - near) : 0,
            dmean: fill ? dsum / fill : 0, Eraw: Er, Efilt: Ef, Esh,
            nmean: fill ? nsum / fill : 0, sigMean: fill ? sgsum / fill : 0,
          };
        };
        /** The resolve's own four corners and weights, mirrored on the CPU. */
        const cornersOf = (D, px, py, P, N) => {
          const TT = gd.tile;
          const tfx = (px + 0.5) / TT - 0.5;
          const tfy = (py + 0.5) / TT - 0.5;
          const bx = Math.floor(tfx); const by = Math.floor(tfy);
          const fx = tfx - bx; const fy = tfy - by;
          const outArr = [];
          for (let c = 0; c < 4; c++) {
            const dx = c & 1; const dy = (c >> 1) & 1;
            const ix = Math.min(Math.max(bx + dx, 0), gd.probeW - 1);
            const iy = Math.min(Math.max(by + dy, 0), gd.probeH - 1);
            const st = probeStat(D, iy * gd.probeW + ix, N);
            const bl = (dx ? fx : 1 - fx) * (dy ? fy : 1 - fy);
            const wp = Math.exp(-Math.abs(
              N[0] * (st.pos[0] - P[0]) + N[1] * (st.pos[1] - P[1]) + N[2] * (st.pos[2] - P[2])) / (2 * wd.voxel0));
            const wn = Math.max(0, N[0] * st.nrm[0] + N[1] * st.nrm[1] + N[2] * st.nrm[2]);
            outArr.push({ ...st, ix, iy, bl, wp, wn, w: bl * wp * wn * wn * st.valid });
          }
          return outArr;
        };
        {
          const D = await dumpBuffers();
          const audit = [];
          const WANT = ["floorSpot", "redWall", "boxTop", "sphere", "sphereEdge"];
          say("");
          say("PROBE AUDIT — placement → trace → filter → resolve, per crop");
          for (const name of WANT) {
            const c = inFrame.find((x) => x.name === name);
            if (!c) continue;
            const cs = cornersOf(D, c.px, c.py, c.pos, c.nrm);
            const wsum = cs.reduce((a, x) => a + x.w, 0);
            const E = [0, 1, 2].map((k) => (wsum > 1e-5
              ? cs.reduce((a, x) => a + x.Esh[k] * x.w, 0) / wsum
              : cs.slice().sort((a, b) => b.w - a.w)[0].Esh[k]));
            say(`  ${name}  P ${c.pos.map((v) => v.toFixed(2)).join(",")}  N ${c.nrm.map((v) => v.toFixed(2)).join(",")}` +
              `  px ${c.px},${c.py}  crop E ${lum(c.irr).toFixed(3)}  mirror E ${lum(E).toFixed(3)}` +
              `  sumW ${wsum.toFixed(3)}${wsum <= 1e-5 ? "  <- ALL FOUR CORNERS REJECTED (fallback)" : ""}`);
            for (const x of cs) {
              say(`    probe ${String(x.pi).padStart(5)} @${x.ix},${x.iy} valid ${x.valid.toFixed(0)} ` +
                `n ${x.nrm.map((v) => v.toFixed(2)).join(",").padEnd(17)} pos ${x.pos.map((v) => v.toFixed(2)).join(",").padEnd(20)} ` +
                `| bl ${x.bl.toFixed(2)} wp ${x.wp.toFixed(2)} wn ${x.wn.toFixed(2)} w ${x.w.toFixed(3)} ` +
                `| fill ${String(x.fill).padStart(2)}/${OCTN} self ${String(x.self).padStart(2)} sky ${String(x.sky).padStart(2)} ` +
                `near<1m ${String(x.near).padStart(2)} L ${x.nearL.toFixed(3)} far L ${x.farL.toFixed(3)} ` +
                `dm ${x.dmean.toFixed(2)} | Eraw ${lum(x.Eraw).toFixed(3)} Efilt ${lum(x.Efilt).toFixed(3)} Esh ${lum(x.Esh).toFixed(3)}`);
            }
            audit.push({ name, P: c.pos, N: c.nrm, px: c.px, py: c.py, cropE: c.irr, mirrorE: E, wsum, corners: cs });
          }
          results.probeAudit = audit;
          // The full oct map of the dominant probe on the two crops that are
          // still wrong, so the node runner can path-trace the SAME 64
          // directions from the SAME point and say, per direction, whether the
          // GPU stopped where the geometry actually is.
          results.texelDump = ["sphere", "boxTop"].map((name) => {
            const a = audit.find((x) => x.name === name);
            if (!a) return null;
            const best = a.corners.slice().sort((x, y) => y.w - x.w)[0];
            return { name, probe: best.pi, pos: best.pos, nrm: best.nrm, texels: best.texels };
          }).filter(Boolean);

          // ── the wall ladder: irradiance and probe health versus HEIGHT ──
          const ladder = inFrame.filter((x) => x.name.startsWith("wall@"));
          say("  wall ladder (red wall, z = -1, camera eye y = -0.50)");
          const ladderRows = [];
          for (const c of ladder) {
            const cs = cornersOf(D, c.px, c.py, c.pos, c.nrm);
            const wsum = cs.reduce((a, x) => a + x.w, 0);
            const selfPct = 100 * cs.reduce((a, x) => a + x.self, 0) / Math.max(1, cs.reduce((a, x) => a + x.fill, 0));
            const row = {
              name: c.name, y: c.pos[1], px: c.px, py: c.py, tileRow: Math.floor(c.py / gd.tile),
              E: lum(c.irr), Eraw: cs.reduce((a, x) => a + lum(x.Eraw), 0) / 4,
              Efilt: cs.reduce((a, x) => a + lum(x.Efilt), 0) / 4,
              wsum, selfPct, samples: c.samples,
              planeSpread: Math.max(...cs.map((x) => Math.abs(
                c.nrm[0] * (x.pos[0] - c.pos[0]) + c.nrm[1] * (x.pos[1] - c.pos[1]) + c.nrm[2] * (x.pos[2] - c.pos[2])))),
              reprojOther: cs.filter((x) => x.prev >= 0 && x.prev !== x.pi).length,
            };
            ladderRows.push(row);
            say(`    y ${row.y.toFixed(2).padStart(6)} px ${String(row.px).padStart(4)},${String(row.py).padStart(3)} ` +
              `tileRow ${String(row.tileRow).padStart(3)} | E ${row.E.toFixed(3)} Eraw ${row.Eraw.toFixed(3)} ` +
              `Efilt ${row.Efilt.toFixed(3)} | sumW ${row.wsum.toFixed(2)} self ${row.selfPct.toFixed(1)}% ` +
              `planeD ${row.planeSpread.toFixed(3)} m reproj-elsewhere ${row.reprojOther}/4`);
          }
          results.wallLadder = ladderRows;
        }

        // ══════════════ THE CACHE, READ AT SURFACES WE CAN NAME (§3.2 item 2)
        //
        // ⭐ THE PROBE'S OCT MAP SAID "ZERO ALONG THAT DIRECTION". THE CACHE IS
        // WHERE THAT ZERO EITHER IS OR IS NOT. The texel dump established that
        // the sphere's rays land where the analytic geometry says they should
        // — 0/41 phantom blockers, distances within a voxel — and still bring
        // back nothing along the directions with the highest cosine weight.
        // That leaves exactly one stage between the trace and the texel: the
        // radiance cache. So it is read directly, on the CPU, at surfaces this
        // page can name, through the SAME addressing rule the kernel uses
        // (brick = the voxel index's top bits, in-brick voxel = its bottom
        // bits, face = the outward normal's dominant axis). No GPU code, no
        // new pass: the buffer is already read back for `cacheHealth`.
        const FACE_OF = (n) => {
          const ax = Math.abs(n[0]); const ay = Math.abs(n[1]); const az = Math.abs(n[2]);
          if (ax >= ay && ax >= az) return n[0] < 0 ? 1 : 0;
          if (ay >= az) return n[1] < 0 ? 3 : 2;
          return n[2] < 0 ? 5 : 4;
        };
        const cacheAt = (u32c, u32w, pt, n, level = 0) => {
          const v = wd.voxel0 * (2 ** level);
          // Half a cell INTO the surface, so the cell is the OCCUPIED one and
          // not the empty one the surface point sits on the boundary of.
          const q = [0, 1, 2].map((a) => Math.floor((pt[a] - n[a] * v * 0.5) / v));
          const cx = q[0] & 63; const cy = q[1] & 63; const cz = q[2] & 63;
          const vi = cx | (cy << 6) | (cz << 12);
          const b = (cx >> 2) | ((cy >> 2) << 4) | ((cz >> 2) << 8);
          const lv = (cx & 3) | ((cy & 3) << 2) | ((cz & 3) << 4);
          const face = FACE_OF(n);
          const m = u32c[cache.MAP_OFF + level * store.BRICKS_PER_LEVEL + b];
          const word = m ? u32c[cache.DATA_OFF + (m - 1) * cacheMod.SLOT_WORDS
            + lv * cacheMod.SLOT_FACES + face] : 0;
          const base = level * store.LEVEL_WORDS;
          const occ = (u32w[base + store.OCC_OFF + (vi >>> 5)] >>> (vi & 31)) & 1;
          const faceBits = (u32w[base + store.FACE_OFF + (vi >>> 2)] >>> ((vi & 3) * 8)) & 255;
          const pal = (u32w[base + store.PAL_OFF + (vi >>> 2)] >>> ((vi & 3) * 8)) & 255;
          return { cell: q, vi, brick: b, slot: m, face, word, rgb: cacheMod.unpackRgbe(word), occ, faceBits, pal };
        };
        {
          const u32c = new Uint32Array(await renderer.getArrayBufferAsync(cache.attribute));
          const u32w = new Uint32Array(await renderer.getArrayBufferAsync(win.attribute));
          const SURFACES = [
            { name: "floor", p: [0, -3, 0], n: [0, 1, 0], wantPal: 1 },
            { name: "ceiling", p: [0, 3, 0], n: [0, -1, 0], wantPal: 2 },
            { name: "panel", p: [0, 2.9, 0], n: [0, -1, 0], wantPal: 0 },
            { name: "wall -X (red)", p: [-5, 0, 0], n: [1, 0, 0], wantPal: 3 },
            { name: "wall +X (green)", p: [5, 0, 0], n: [-1, 0, 0], wantPal: 4 },
            { name: "wall -Z (seen)", p: [0, 0, -5], n: [0, 0, 1], wantPal: 5 },
            { name: "wall +Z (behind)", p: [0, 0, 5], n: [0, 0, -1], wantPal: 6 },
            { name: "wall +Z at y=0", p: [1.2, 0, 5], n: [0, 0, -1], wantPal: 6 },
            { name: "box top", p: [-2, -1, -1.5], n: [0, 1, 0], wantPal: 7 },
            { name: "box +Z face", p: [-2, -2, -0.5], n: [0, 0, 1], wantPal: 7 },
          ];
          say("  CACHE, read at named surfaces (level 0): the radiance a ray that hits here comes back with");
          const rows = [];
          for (const sf of SURFACES) {
            const r = cacheAt(u32c, u32w, sf.p, sf.n);
            const l = r.rgb ? lum(r.rgb) : 0;
            rows.push({ ...sf, ...r, lumv: l });
            say(`    ${sf.name.padEnd(16)} cell ${r.cell.join(",").padEnd(14)} occ ${r.occ} ` +
              `faceBits ${r.faceBits.toString(2).padStart(6, "0")} pal ${String(r.pal).padStart(2)}` +
              `${r.pal === sf.wantPal ? "" : `(want ${sf.wantPal})`} slot ${String(r.slot).padStart(4)} ` +
              `face ${r.face} | cache ${r.rgb ? r.rgb.map((x) => x.toFixed(4)).join(" ") : "NEVER WRITTEN"} ` +
              `lum ${l.toFixed(4)}`);
          }
          results.cacheSurfaces = rows;

          // ⭐ EVERY NON-ZERO ENTRY ABOVE IS ON A SURFACE THE CAMERA CAN SEE.
          // The one surface in this room that no pixel ever covers — the +Z
          // wall, behind the camera — reads an explicitly WRITTEN zero (the
          // RGBE word is non-zero, its mantissas are not). So the cache's
          // whole content might be `injectLitFrame`'s and none of it §L.2's
          // fresh-slot shading, and the crop table cannot tell those apart
          // because every crop is on a visible surface.
          //
          // So: clear the cache and run the chain with the INJECTION PASS
          // SWITCHED OFF. What is in the cache afterwards is `shadeHit`'s
          // output and nothing else.
          await compute(cache.clearPass);
          await compute(cache.allocPass);
          let ni = FRAMES + 400;
          for (let i = 0; i < 40; i++) await runFrame(ni++, { inject: false });
          {
            const c2 = new Uint32Array(await renderer.getArrayBufferAsync(cache.attribute));
            const w2 = new Uint32Array(await renderer.getArrayBufferAsync(win.attribute));
            say("  CACHE, injection OFF — this is `shadeHit` alone:");
            const shadeRows = [];
            for (const sf of SURFACES) {
              const r = cacheAt(c2, w2, sf.p, sf.n);
              const l = r.rgb ? lum(r.rgb) : 0;
              shadeRows.push({ ...sf, ...r, lumv: l });
              say(`    ${sf.name.padEnd(16)} slot ${String(r.slot).padStart(4)} face ${r.face} | ` +
                `${r.rgb ? r.rgb.map((x) => x.toFixed(4)).join(" ") : "NEVER WRITTEN"} lum ${l.toFixed(4)}`);
            }
            const ctl = cache.readControl(c2);
            const st = await readStats();
            say(`  shade-only arm: ${st.freshShades} fresh shades over 40 frames, ` +
              `${shadeRows.filter((x) => x.lumv > 1e-4).length}/${shadeRows.length} named surfaces carry light`);
            results.shadeOnly = { rows: shadeRows, ctl };

            // ── and WHY: every intermediate of `shadeHit` at the same points
            const sIn = gather.buffers.shadeIn.value.array;
            const probes = SURFACES.filter((x) => x.name !== "wall -Z (seen)")
              .slice(0, gather.SHADE_SLOTS);
            probes.forEach((sf, i) => {
              const r = cacheAt(c2, w2, sf.p, sf.n);
              // the face's own sample point — the voxel centre pushed half a
              // cell out along the face normal, exactly what the kernel uses
              const v = wd.voxel0;
              const centre = r.cell.map((c) => (c + 0.5) * v);
              sIn[i * 8] = centre[0] + sf.n[0] * v * 0.5;
              sIn[i * 8 + 1] = centre[1] + sf.n[1] * v * 0.5;
              sIn[i * 8 + 2] = centre[2] + sf.n[2] * v * 0.5;
              sIn[i * 8 + 3] = 0; // level
              sIn[i * 8 + 4] = sf.n[0];
              sIn[i * 8 + 5] = sf.n[1];
              sIn[i * 8 + 6] = sf.n[2];
              sIn[i * 8 + 7] = r.vi;
            });
            gather.buffers.shadeIn.value.needsUpdate = true;
            await compute(gather.passes.shadeProbe);
            const so = new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.shadeOut.value));
            say("  shadeHit, term by term (centre stratum of the panel shown for the NEE):");
            say("    surface           albedo            emis   N.L(sun) sunHit  cosX   cosP     d   tStop   vis   E.r  shaded");
            const shadeTerms = [];
            probes.forEach((sf, i) => {
              const b = i * 16;
              const row = {
                name: sf.name, albedo: [so[b], so[b + 1], so[b + 2]], emissive: so[b + 3],
                ndl: so[b + 4], sunHit: so[b + 5], cosX: so[b + 6], cosP: so[b + 7],
                d: so[b + 8], tStop: so[b + 9], vis: so[b + 10], Ecentre: so[b + 11],
                shaded: [so[b + 12], so[b + 13], so[b + 14]],
              };
              shadeTerms.push(row);
              say(`    ${sf.name.padEnd(16)} ${row.albedo.map((x) => x.toFixed(2)).join(",")}  ` +
                `${row.emissive.toFixed(2)}  ${row.ndl.toFixed(3)}  ${row.sunHit.toFixed(0).padStart(5)}  ` +
                `${row.cosX.toFixed(3)} ${row.cosP.toFixed(3)} ${row.d.toFixed(2).padStart(5)} ` +
                `${row.tStop.toFixed(2).padStart(6)} ${row.vis.toFixed(0).padStart(4)} ` +
                `${row.Ecentre.toFixed(3).padStart(6)} ${lum(row.shaded).toFixed(4)}`);
            });
            results.shadeTerms = shadeTerms;
          }
          // Restore: clear again and let the full chain refill it.
          await compute(cache.clearPass);
          await compute(cache.allocPass);
          for (let i = 0; i < 60; i++) await runFrame(ni++);
        }

        // ── the wall column: every screen row, from the lit buffer ────────
        //
        // The ladder above samples eight heights through 9×9 blocks; mottling
        // and a one-row step live BELOW that. This walks a 33-px-wide band of
        // the red wall row by row, so a step at the camera's own height shows
        // up as a row index and a ratio, and "mottling" becomes the spread
        // WITHIN a tile row against the spread ACROSS tile rows.
        const wallColumn = async (label) => {
          const f = new Float32Array(await renderer.getArrayBufferAsync(gather.buffers.litBuf.value));
          const cx = Math.round(project([-4.99, -0.5, -1.0]).x);
          const yTop = Math.round(project([-4.99, 2.9, -1.0]).y);
          const yBot = Math.round(project([-4.99, -2.9, -1.0]).y);
          const y0 = Math.max(1, Math.min(yTop, yBot) + 4);
          const y1 = Math.min(Hh - 2, Math.max(yTop, yBot) - 4);
          const x0 = Math.max(0, cx - 16); const x1 = Math.min(W - 1, cx + 16);
          const rows = [];
          for (let y = y0; y <= y1; y++) {
            let sum = 0; let n = 0;
            for (let x = x0; x <= x1; x++) {
              const b = (y * W + x) * 4;
              if (f[b + 3] > 0.5) { sum += lum([f[b], f[b + 1], f[b + 2]]); n++; }
            }
            rows.push({ y, v: n ? sum / n : null, n });
          }
          const good = rows.filter((r) => r.v != null && r.n > 20);
          const horizon = Math.round(project([-4.99, camera.position.y, -1.0]).y);
          let step = { ratio: 1, y: null };
          for (let i = 1; i < good.length; i++) {
            if (good[i].y !== good[i - 1].y + 1) continue;
            const r = good[i].v / Math.max(1e-9, good[i - 1].v);
            if (Math.abs(Math.log(r)) > Math.abs(Math.log(step.ratio))) step = { ratio: r, y: good[i].y };
          }
          // Within-tile spread vs across-tile spread — the mottling number.
          const byTile = new Map();
          for (const r of good) {
            const k = Math.floor(r.y / gd.tile);
            if (!byTile.has(k)) byTile.set(k, []);
            byTile.get(k).push(r.v);
          }
          const tileMeans = [...byTile.entries()].sort((a, b) => a[0] - b[0]).map(([k, v]) => ({
            k, m: v.reduce((a, x) => a + x, 0) / v.length,
          }));
          const cv = (xs) => {
            const m = xs.reduce((a, x) => a + x, 0) / xs.length;
            return Math.sqrt(xs.reduce((a, x) => a + (x - m) * (x - m), 0) / xs.length) / Math.max(1e-9, m);
          };
          const withinCv = [...byTile.values()].filter((v) => v.length > 3).map(cv);
          const acrossCv = cv(tileMeans.map((t) => t.m));
          // ⚠ "ACROSS-TILE CV" CONTAINS THE WALL'S REAL GRADIENT. Irradiance
          // on this wall genuinely rises toward the panel — the reference
          // spans 1.74 to 2.11 over the same range — so a raw CV over forty
          // tile rows is part signal and part mottling, and an A/B between
          // two arms of the estimator can only move the second part. The
          // detrended figure subtracts a 5-tile moving average first, which
          // is the low-frequency term the eye reads as SHADING and not as
          // BLOTCHES.
          const ms = tileMeans.map((t) => t.m);
          const resid = ms.map((v, i) => {
            let sum = 0; let n2 = 0;
            for (let k = Math.max(0, i - 2); k <= Math.min(ms.length - 1, i + 2); k++) { sum += ms[k]; n2++; }
            return v / (sum / n2);
          });
          const detrended = Math.sqrt(resid.reduce((a, x) => a + (x - 1) * (x - 1), 0) / resid.length);
          const withinMean = withinCv.reduce((a, x) => a + x, 0) / Math.max(1, withinCv.length);
          let maxTileStep = { ratio: 1, k: null };
          for (let i = 1; i < tileMeans.length; i++) {
            if (tileMeans[i].k !== tileMeans[i - 1].k + 1) continue;
            const r = tileMeans[i].m / Math.max(1e-9, tileMeans[i - 1].m);
            if (Math.abs(Math.log(r)) > Math.abs(Math.log(maxTileStep.ratio))) maxTileStep = { ratio: r, k: tileMeans[i].k };
          }
          say(`  wall column [${label}] rows ${y0}..${y1}, horizon (camera height) row ${horizon}: ` +
            `worst row step ${step.ratio.toFixed(3)}x at row ${step.y} ` +
            `(${step.y === horizon ? "ON the horizon" : `${step.y - horizon} rows off it`}); ` +
            `worst TILE-row step ${maxTileStep.ratio.toFixed(3)}x at tile row ${maxTileStep.k}`);
          say(`  wall column [${label}]: CV within a tile row ${(100 * withinMean).toFixed(2)} %, across tile rows ` +
            `${(100 * acrossCv).toFixed(2)} %, DETRENDED ${(100 * detrended).toFixed(2)} % — the last is the mottling`);
          say(`  wall column [${label}] profile: ${tileMeans.map((t) => t.m.toFixed(3)).join(" ")}`);
          return {
            label, x0, x1, y0, y1, horizon, step, maxTileStep, withinCv: withinMean, acrossCv, detrended,
            tileMeans, rows: good.map((r) => [r.y, +r.v.toFixed(4)]),
          };
        };
        // ⭐ IS THE STEP A PLACE OR A SAMPLE? A single scan can only say where
        // the worst step LANDED. Two scans of the same parked camera, twenty
        // frames apart, say whether it is a property of the wall or of the
        // noise: a structural step stays on its row, a sampling one moves.
        // The third scan is the hysteresis A/B — §L.3's "force α = 0.5 on a
        // large change" against the same wall with the force switched off.
        {
          // ⚠ ONE SCAN PER ARM IS BLIND. The first attempt read 14.60 % of
          // across-tile CV with the hysteresis on and 18.28 % with it off and
          // could have called that a result — except a SECOND scan of the
          // same arm, forty frames later, read 16.10 %. The arm-to-arm
          // difference was inside the arm's own spread. So each arm is scanned
          // five times, ten frames apart, and compared by MEDIAN — the same
          // paired discipline the motion instrument now uses.
          let nn = FRAMES + 200;
          const arm = async (label, apply, restore) => {
            apply();
            for (let i = 0; i < 24; i++) await runFrame(nn++); // let the arm take
            const scans = [];
            for (let k = 0; k < 5; k++) {
              scans.push(await wallColumn(`${label} #${k}`));
              for (let i = 0; i < 10; i++) await runFrame(nn++);
            }
            const st = await readStats();
            restore();
            const cvs = scans.map((x) => x.detrended).sort((a, b) => a - b);
            const steps = scans.map((x) => x.step.y);
            return {
              label, scans, medCv: cvs[2], minCv: cvs[0], maxCv: cvs[4],
              stepRows: steps, stepOnHorizon: steps.filter((y) => y === scans[0].horizon).length,
              medStep: scans.map((x) => x.step.ratio).sort((a, b) => a - b)[2],
              alphaForced: st.alphaForced,
            };
          };
          const armBase = await arm("H=4 hyst ON", () => {}, () => {});
          const armH8 = await arm("H=8 hyst ON", () => { gu.historyU.value = 8; }, () => { gu.historyU.value = gd.history; });
          const armNoHyst = await arm("H=4 hyst OFF", () => { gu.hystOn.value = 0; }, () => { gu.hystOn.value = 1; });
          const arms = [armBase, armH8, armNoHyst];
          say("  MOTTLING, five scans per arm, ten frames apart (DETRENDED tile-row CV of the red wall):");
          for (const a of arms) {
            say(`    ${a.label.padEnd(14)} median CV ${(100 * a.medCv).toFixed(2)} % ` +
              `(${(100 * a.minCv).toFixed(2)}–${(100 * a.maxCv).toFixed(2)} %)  ` +
              `worst-step row ${a.stepRows.join(",")} — ${a.stepOnHorizon}/5 on the horizon, ` +
              `median step ${a.medStep.toFixed(3)}x`);
          }
          say(`  the tone step is ${armBase.stepOnHorizon >= 4 ? "STRUCTURAL: it does not move off the horizon row" : "a SAMPLE: it wanders"}; ` +
            `the arms' CV spreads ${arms.map((a) => `${(100 * a.minCv).toFixed(1)}-${(100 * a.maxCv).toFixed(1)}`).join(" | ")} ` +
            `${Math.max(armBase.maxCv, armH8.maxCv) > Math.min(armBase.minCv, armH8.minCv) * 1.0 && armH8.medCv < armBase.minCv ? "SEPARATE" : "OVERLAP"}`);
          results.wallColumn = armBase.scans[2];
          results.mottlingArms = arms.map(({ scans, ...rest }) => rest);
        }

        // ══════════════ §19 STAGE 3.6 — THE NOISE, ONE LEVER AT A TIME ═══════
        //
        // ⚠ `?levers=0` SKIPS THIS WHOLE SECTION, and the reason it can is
        // that the gather's FACTORY DEFAULTS are the shipped state: nothing
        // below is a uniform this page has to set to make the numbers above
        // and below it describe what ships. Fifteen arms of ~190 settle frames
        // each is most of this page's wall time, and the 3.3 gates do not
        // depend on any of it.
        //
        // ⭐ EVERY LEVER IS A UNIFORM (OR A CHOICE OF KERNEL), SO "BASELINE" IS
        // A STATE THIS BINARY CAN ENTER. Stage 3.5's estimator is not a
        // previous commit to be checked out and re-timed on a GPU that has
        // moved; it is `historyU = 4, hystOn = legacy, reprojWide = 0, the 3×3
        // SH filter, injectAlpha = 0.25, the composite injected`. The arms are
        // CUMULATIVE — each adds one lever to the last — so a lever that does
        // nothing shows up as two rows that do not differ, and a lever that
        // undoes another shows up as a row that goes backwards.
        //
        // ⚠ AND EVERY ARM SETTLES BEFORE IT IS MEASURED. H = 32 needs ~32
        // frames per DIRECTION and each probe traces 16 of its 64 directions
        // per frame, so a texel is sampled every fourth frame: a receipt taken
        // 20 frames after the switch would be measuring the transient, and the
        // longer memory would score WORSE than the shorter one for a reason
        // that has nothing to do with either.
        if (params.get("levers") !== "0") {
          let nn = FRAMES + 900;
          const BASE = {
            historyU: 4, hystOn: gatherMod.HYST.legacy, reprojWide: 0,
            injectAlpha: 0.25, injectGlossy: 1, sh3: true, anchorJitter: 1,
          };
          const setArm = (a) => {
            for (const [k, v] of Object.entries(a)) {
              if (k === "sh3") SH3 = v; else gu[k].value = v;
            }
          };
          const SHIP = {
            historyU: gd.history, hystOn: gatherMod.HYST.decay, reprojWide: 1,
            injectAlpha: 0.25, injectGlossy: 0, sh3: false, anchorJitter: 0,
            shadeProb: gd.shadeProb, skyAtHit: 1, needRays: 1, priorOn: 1,
          };
          /**
           * ⭐ §19 STAGE 3.7's OWN BASELINE — 3.6 EXACTLY, OUT OF THIS BINARY.
           *
           * `BASE` above is the 3.5 baseline the 3.6 lever table was written
           * against, and comparing 3.7 to it would credit 3.7 with everything
           * 3.6 already did. The four uniforms below are the whole of 3.7:
           * `shadeProb = 0` makes the cache one-shot again (a face is shaded on
           * first hit and never revisited), `skyAtHit = 0` removes the sky term
           * from `shadeHit`, `needRays = 0` gives every probe a flat `R`, and
           * `priorOn = 0` starts a fresh probe at zero. Set all four and the
           * gather is 3.6's, compiled from 3.7's source.
           */
          const PRE37 = {
            ...SHIP, shadeProb: 0, skyAtHit: 0, needRays: 0, priorOn: 0,
          };
          const settle = async (k) => { for (let i = 0; i < k; i++) await runFrame(nn++); };
          /** One frame's counters, cleared first so they are PER FRAME. */
          const frameStats = async () => {
            await compute(gather.passes.clearStats);
            await runFrame(nn++);
            return readStats();
          };
          /**
           * FRAMES TO 90 % OF SETTLED, with the probe grid cleared and the
           * CACHE LEFT WARM — the number this measures is the accumulator's
           * own convergence, not the cache's first light, which `firstLight`
           * already reports at boot.
           */
          //
          // ⚠⚠ AND IT LEAVES THE GRID SETTLED AGAIN. The first cut of this
          // instrument cleared the probes, ran until the crop crossed 90 %,
          // and handed the NEXT arm a grid that was nine frames old. With
          // H = 32 a texel is sampled every fourth frame, so 80 settle frames
          // is twenty samples of thirty-two — and every cumulative arm was
          // measured on a HALF-BUILT accumulator while the alternative arms,
          // which run no convergence test, were measured on a full one. The
          // table read "α = 0.25 is 1.33 % here and 1.96 % there" for the same
          // α. A settle is not optional bookkeeping; it is the arm.
          const convergeFrames = async (maxF = 90) => {
            await settle(30);
            writeCrops();
            const settled = lum((await readCrops()).find((x) => x.name === "floorSpot").irr);
            await compute(gather.passes.clearProbes);
            await compute(gather.passes.clearMeta);
            let f50 = null; let f90 = null;
            const series = [];
            for (let i = 1; i <= maxF; i++) {
              await runFrame(nn++);
              writeCrops();
              const e = lum((await readCrops()).find((x) => x.name === "floorSpot").irr);
              series.push(+e.toFixed(4));
              if (f50 == null && e > 0.5 * settled) f50 = i;
              if (f90 == null && e > 0.9 * settled) { f90 = i; break; }
            }
            await settle(SETTLE);
            return { settled, f50, f90, series };
          };
          /** ~4·H frames: `H` samples per texel at one sample every `stride`. */
          const SETTLE = Math.max(80, 5 * gd.history);
          const runArm = async (label, arm, { probeSpace = false, converge = false } = {}) => {
            setArm(arm);
            await settle(SETTLE);
            const st = await frameStats();
            const noise = await noiseReceipt(label, {
              frames: 30, advance: async () => { await runFrame(nn++); }, probeSpace,
            });
            const conv = converge ? await convergeFrames() : null;
            const row = {
              label, arm: { ...arm }, noise, converge: conv,
              alphaForced: st.alphaForced, raysTraced: st.raysTraced,
              alphaForcedPct: 100 * st.alphaForced / Math.max(1, st.raysTraced),
              reprojPct: 100 * st.reprojHits / Math.max(1, st.probesValid),
              maturePct: 100 * st.matureTexels / Math.max(1, st.texelsSeen),
              census: {
                offScreen: st.reprojOffScreen, noPrev: st.reprojNoPrev,
                plane: st.reprojPlane, slant: st.reprojSlant, align: st.reprojAlign,
              },
            };
            say(`  LEVER ${label.padEnd(22)} reset ${row.alphaForcedPct.toFixed(2)} % | reproj ` +
              `${row.reprojPct.toFixed(2)} % | mature ${row.maturePct.toFixed(1)} % | ` +
              `converge 50/90 ${conv?.f50 ?? "—"}/${conv?.f90 ?? "—"} frames | census ` +
              Object.entries(row.census).map(([k, v]) => `${k} ${v}`).join(" "));
            return row;
          };
          const levers = [];
          const cum = { ...BASE };
          levers.push(await runArm("0 baseline (3.5)", { ...cum }, { probeSpace: true, converge: true }));
          cum.historyU = gd.history;
          levers.push(await runArm(`1 +H=${gd.history}`, { ...cum }));
          cum.hystOn = gatherMod.HYST.variance;
          levers.push(await runArm("2 +variance hyst", { ...cum }));
          cum.reprojWide = 1;
          levers.push(await runArm("3 +wide reproj", { ...cum }));
          cum.sh3 = false;
          levers.push(await runArm(`4 +SH ${2 * gd.shRadius + 1}x${2 * gd.shRadius + 1}`, { ...cum }));
          cum.anchorJitter = 0;
          levers.push(await runArm("5 +frozen anchor", { ...cum }));
          cum.hystOn = gatherMod.HYST.decay;
          levers.push(await runArm("6 +decaying hyst", { ...cum }));
          cum.injectGlossy = 0;
          levers.push(await runArm("7 +inject diffuse", { ...cum }, { probeSpace: true, converge: true }));
          // ── the arms that are NOT on the ladder: what each choice was
          // measured AGAINST. A cumulative table says a lever helped; it never
          // says the alternative would have helped more.
          for (const [label, over] of [
            ["· hyst OFF", { hystOn: gatherMod.HYST.off }],
            ["· hyst reset (n←1)", { hystOn: gatherMod.HYST.variance }],
            ["· hyst reset AND dist", { hystOn: gatherMod.HYST.varianceAndDist }],
            ["· inject a=0.1", { injectAlpha: 0.1 }],
            ["· anchor jitter back", { anchorJitter: 1 }],
            // ⭐ THE H CURVE IS THE TRADE ITSELF. Every frame of memory is a
            // frame of lag, and the panel-move arm below prices the lag; this
            // prices the quiet. Two numbers, one axis, and the choice of H is
            // then an argument about which end of it the user wants.
            ["· H=8", { historyU: 8 }],
            ["· H=16", { historyU: 16 }],
          ]) levers.push(await runArm(label, { ...cum, ...over }));
          setArm(SHIP);
          await settle(60);
          results.levers = levers;

          // ── the WORLD changes: the panel jumps 2 m ──────────────────────
          //
          // ⭐⭐ THIS IS THE ONLY RECEIPT THAT CAN CONDEMN A LONG MEMORY. H = 32
          // and a hysteresis that never fires are together a 32-frame lag on
          // every lighting change, and no at-rest noise number can see that.
          // The panel is MOVED — in the analytic primitive buffer the
          // voxelizer reads AND in the three.js mesh the gbuffer is rendered
          // from, so the world really changed and not just one description of
          // it — and the receipt is how many frames the floor takes to get 90 %
          // of the way from its old irradiance to its new one.
          {
            const panelMesh = scene.children[0];
            const prims = fill.prims.value;
            const movePanel = async (dx) => {
              prims.array[0] = PANEL.min[0] + dx;
              prims.array[4] = PANEL.max[0] + dx;
              prims.needsUpdate = true;
              panelMesh.position.x = dx;
              panelMesh.updateMatrixWorld(true);
              gu.panelCentre.value.set(PANEL_INFO.centre[0] + dx, PANEL_INFO.centre[1], PANEL_INFO.centre[2]);
              await compute(win.clearStaticPass);
              await compute(fill.pass);
              await compute(cache.allocPass);
            };
            const readE = async () => {
              writeCrops();
              const c = await readCrops();
              return Object.fromEntries(c.filter((x) => !x.diag).map((x) => [x.name, lum(x.irr)]));
            };
            const armMove = async (label) => {
              await settle(60);
              const before = await readE();
              await movePanel(2);
              const WATCH = 200;
              const series = [];
              for (let i = 1; i <= WATCH; i++) { await runFrame(nn++); series.push(await readE()); }
              await settle(250);
              const after = await readE();
              // 90 % of the way from `before` to `after`, on the crops that
              // actually MOVED — a crop whose irradiance did not change cannot
              // time a change, and averaging it in only dilutes the answer.
              //
              // ⚠ AND IT MUST STAY THERE. `findIndex` on "within 10 % of the
              // final value" would be satisfied by a value on its way PAST the
              // target, which a hysteresis that overshoots does on its first
              // sample; the crossing counts only if every later frame in the
              // window is also inside the band.
              const moved = Object.keys(after).filter((k) => Math.abs(after[k] - before[k]) > 0.25 * before[k]);
              const frames = moved.map((k) => {
                const d = Math.abs(after[k] - before[k]);
                const sgn = Math.sign(after[k] - before[k]);
                // `frame` — the first frame that has covered 90 % of the
                // distance. This is what "converges to the new state in N
                // frames" means, and it is the number the gate reads.
                const f90 = series.findIndex((s) => sgn * (s[k] - before[k]) >= 0.9 * d);
                // `lock` — the frame after which it never leaves the ±10 %
                // band again. Stricter, and the one that catches an estimator
                // that gets there by overshooting and coming back.
                let lock = -1;
                for (let i = series.length - 1; i >= 0; i--) {
                  if (Math.abs(series[i][k] - after[k]) <= 0.1 * d) lock = i; else break;
                }
                // ⭐ AND A PROFILE, BECAUSE "NEVER" IS NOT A MEASUREMENT. A
                // crossing frame is a single threshold on a curve; when no arm
                // crosses inside the window the table says "never" for every
                // one of them and the arms stop being comparable. The FRACTION
                // of the change completed at fixed frames is the curve itself,
                // and it separates "slow" from "stuck" without a threshold.
                const at = (i) => (i - 1 < series.length
                  ? +(sgn * (series[i - 1][k] - before[k]) / d).toFixed(3) : null);
                return {
                  crop: k, before: +before[k].toFixed(3), after: +after[k].toFixed(3),
                  frame: f90 < 0 ? null : f90 + 1, lock: lock < 0 ? null : lock + 1,
                  done: { 10: at(10), 30: at(30), 60: at(60), 120: at(120), 200: at(200) },
                  trace: [0, 1, 2, 4, 9, 19, 39, 79, 149, 199].filter((i) => i < series.length)
                    .map((i) => +series[i][k].toFixed(3)),
                };
              });
              await movePanel(0);
              await settle(150);
              // A crop that never settles is the WORST, not a row to skip.
              const worstOf = (key) => (frames.length === 0 || frames.some((f) => f[key] == null)
