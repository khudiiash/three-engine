<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Cloth GI contribution smoke</title></head><body><canvas id="view"></canvas><script type="module">

    const light=system.state.light;renderer.setRenderTarget(target);light.removeFromParent();await renderer.compileAsync(engine.scene,camera);renderer.render(engine.scene,camera);const off=await renderer.readRenderTargetPixelsAsync(target,0,0,320,240);
    engine.scene.add(light);await renderer.compileAsync(engine.scene,camera);renderer.render(engine.scene,camera);const on=await renderer.readRenderTargetPixelsAsync(target,0,0,320,240);

</script></body></html>
